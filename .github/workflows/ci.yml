name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-syntax:
    name: Python · syntax + import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal deps for import smoke
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy "pydantic>=2.0" requests python-dotenv python-multipart numpy Pillow
      - name: Compile every backend python file
        run: |
          set -e
          find backend/app -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
      - name: Import smoke (FastAPI app)
        env:
          ALLOW_FALLBACK: "1"
          SERVICE_KEY: "ci-stub"
        run: |
          cd backend
          python -c "from app.main import app; print('ok', len(app.routes), 'routes')"

      - name: Pytest (endpoint integration)
        env:
          ALLOW_FALLBACK: "1"
          SERVICE_KEY: "ci-stub"
        run: |
          pip install pytest httpx
          cd backend
          pytest tests/ -v --tb=short -x

  flutter-analyze:
    name: Flutter · analyze (auraview_fleet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auraview_fleet
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub

  docs:
    name: Docs · presence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs exist
        run: |
          for f in README.md docs/WHITEPAPER_KR.md docs/ROADMAP.md docs/DATASETS.md docs/architecture.svg; do
            test -f "$f" && echo "ok $f" || (echo "missing $f" && exit 1)
          done

  docker-build:
    name: Docker · build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auraview/k-perception:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Quick container smoke
        run: |
          docker run -d --rm --name auraview-test -p 8000:8000 \
                -e ALLOW_FALLBACK=1 -e SERVICE_KEY=ci-stub \
                auraview/k-perception:ci
          sleep 8
          curl -fsS http://localhost:8000/healthz || (docker logs auraview-test && exit 1)
          curl -fsS http://localhost:8000/fusion/sources >/dev/null
          docker stop auraview-test
