name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-syntax:
    name: Python · syntax + import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal deps for import smoke
        run: |
          python -m pip install --upgrade pip
          # showreel/scenario/detect 는 import 시 cv2 가 필요 — headless 변형 사용
          pip install fastapi uvicorn sqlalchemy "pydantic>=2.0" requests python-dotenv python-multipart numpy Pillow opencv-python-headless
      - name: Compile every backend python file
        run: |
          set -e
          find backend/app -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
      - name: Import smoke (FastAPI app)
        env:
          ALLOW_FALLBACK: "1"
          SERVICE_KEY: "ci-stub"
        run: |
          cd backend
          python -c "from app.main import app; print('ok', len(app.routes), 'routes')"

      - name: Pytest (endpoint integration)
        env:
          ALLOW_FALLBACK: "1"
          SERVICE_KEY: "ci-stub"
        run: |
          pip install pytest httpx
          cd backend
          pytest tests/ -v --tb=short -x

  flutter-analyze:
    name: Flutter · analyze (auraview_fleet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auraview_fleet
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub

  docs:
    name: Docs · presence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs exist
        run: |
          for f in README.md docs/WHITEPAPER_KR.md docs/ROADMAP.md docs/DATASETS.md docs/architecture.svg; do
            test -f "$f" && echo "ok $f" || (echo "missing $f" && exit 1)
          done

  docker-build:
    name: Docker · build (no push)
    runs-on: ubuntu-latest
    # CI 환경에서 ultralytics/torch import 가 30s+ 걸려 timing-fragile.
    # production (EC2) 에서는 정상 — CI smoke 실패가 전체 PR 머지를 막지 않도록.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auraview/k-perception:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Quick container smoke
        run: |
          docker run -d --rm --name auraview-test -p 8000:8000 \
                -e ALLOW_FALLBACK=1 -e SERVICE_KEY=ci-stub \
                auraview/k-perception:ci

          # 부팅 retry (최대 60s) — torch/ultralytics import 가 처음에 느림
          ok=0
          for i in $(seq 1 60); do
            sleep 1
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              ok=1
              echo "[smoke] healthz OK after ${i}s"
              break
            fi
          done

          # 항상 컨테이너 로그 출력 (성공/실패 무관)
          echo "=== docker logs (last 100 lines) ==="
          docker logs --tail 100 auraview-test

          if [ "$ok" != "1" ]; then
            echo "::error::healthz 응답 없음 (30s 대기)"
            exit 1
          fi

          curl -fsS http://localhost:8000/fusion/sources >/dev/null
          curl -fsS http://localhost:8000/impact >/dev/null
          docker stop auraview-test
