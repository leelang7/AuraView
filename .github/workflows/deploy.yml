name: Deploy

# main / feat/k-perception 브랜치 push 시 EC2 SSH 로 자동 배포.
# 활성화 조건: GitHub repo Settings → Secrets 에 다음 4개 등록 필요
#   EC2_HOST       예: 13.48.70.193
#   EC2_USER       예: ubuntu
#   EC2_SSH_KEY    EC2 접속용 private key 전체 (-----BEGIN ...-----END ...-----)
#   DEPLOY_PATH    예: /home/ubuntu/AuraView
#
# 4개가 모두 설정돼야 step 이 실행됩니다 (없으면 경고 후 skip).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH → git pull → restart uvicorn
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets present
        id: gate
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::warning::EC2 deploy secrets not set — skipping. Add EC2_HOST, EC2_USER, EC2_SSH_KEY, DEPLOY_PATH to enable."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate EC2_SSH_KEY format (fails loudly)
        if: steps.gate.outputs.skip == 'false'
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          PATH_DEPLOY: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 값 자체는 마스킹 — 메타만 노출 + GitHub Job Summary 에 기록.
          lines=$(printf '%s\n' "$KEY" | wc -l)
          chars=$(printf '%s' "$KEY" | wc -c)
          has_begin=$(printf '%s' "$KEY" | grep -c "BEGIN" || true)
          has_end=$(printf '%s' "$KEY"   | grep -c "END"   || true)
          host_len=$(printf '%s' "$HOST" | wc -c)
          user_len=$(printf '%s' "$USER" | wc -c)
          path_len=$(printf '%s' "$PATH_DEPLOY" | wc -c)

          {
            echo "## 🔐 Deploy secret diagnostic"
            echo "| key | lines | chars | BEGIN | END |"
            echo "|---|---:|---:|---:|---:|"
            echo "| EC2_SSH_KEY | $lines | $chars | $has_begin | $has_end |"
            echo ""
            echo "| key | length |"
            echo "|---|---:|"
            echo "| EC2_HOST    | $host_len |"
            echo "| EC2_USER    | $user_len |"
            echo "| DEPLOY_PATH | $path_len |"
            echo ""
            echo "정상 기준: SSH_KEY lines 25~30 · chars 1500~1900 · BEGIN/END 각 1+"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          [ "$lines" -lt 5 ]      && { echo "::error::EC2_SSH_KEY가 한 줄로 들어옴 (lines=$lines). 줄바꿈 손실 — 다시 등록 필요."; fail=1; }
          [ "$chars" -lt 1000 ]   && { echo "::error::EC2_SSH_KEY 너무 짧음 (chars=$chars). 일부만 복사된 듯."; fail=1; }
          [ "$has_begin" -lt 1 ]  && { echo "::error::EC2_SSH_KEY 에 BEGIN 마커 없음."; fail=1; }
          [ "$has_end" -lt 1 ]    && { echo "::error::EC2_SSH_KEY 에 END 마커 없음."; fail=1; }
          [ "$host_len" -lt 7 ]   && { echo "::error::EC2_HOST 비어있거나 너무 짧음."; fail=1; }
          [ "$user_len" -lt 1 ]   && { echo "::error::EC2_USER 비어있음."; fail=1; }
          [ "$path_len" -lt 5 ]   && { echo "::error::DEPLOY_PATH 비어있거나 너무 짧음."; fail=1; }
          [ "$fail" -eq 1 ] && exit 2
          echo "✓ secret 형식 정상 — SSH 연결 단계로 진행"

      - name: SSH deploy (direct shell — appleboy/ssh-action 우회)
        if: steps.gate.outputs.skip == 'false'
        env:
          KEY:   ${{ secrets.EC2_SSH_KEY }}
          HOST:  ${{ secrets.EC2_HOST }}
          USER:  ${{ secrets.EC2_USER }}
          DPATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          SSH_OPTS=( -i ~/.ssh/id_deploy
                     -o StrictHostKeyChecking=no
                     -o UserKnownHostsFile=/dev/null
                     -o ConnectTimeout=15
                     -o BatchMode=yes
                     -o LogLevel=ERROR
                     -o ServerAliveInterval=20 )

          BRANCH="${GITHUB_REF##*/}"
          echo "→ deploy to $USER@$HOST · branch=$BRANCH · path=$DPATH"

          # heredoc 으로 원격 스크립트 전송. \$ 는 원격에서 평가, $ 는 워크플로 변수.
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" bash -s <<REMOTE
          set -euo pipefail
          cd "$DPATH"
          echo "[remote] cwd: \$(pwd)"
          git fetch --all
          git checkout "$BRANCH"
          git pull origin "$BRANCH"
          echo "[remote] HEAD: \$(git rev-parse --short HEAD)"

          python3 -m pip install -r requirements.txt --quiet
          # torch 는 옵션 — 이미 설치되어 있으면 skip 빠름
          python3 -c "import torch" 2>/dev/null || python3 -m pip install --quiet torch numpy

          # ffmpeg — showreel mp4 의 H.264 transcode 에 필수.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

          # 한글 폰트 — apt 가 실패하는 환경 대비해 GitHub raw 직접 다운로드로 보장.
          # 위치: backend/assets/NotoSansKR-Regular.otf (코드에서 절대경로로 사용)
          mkdir -p backend/assets
          FONT_PATH="backend/assets/NotoSansKR-Regular.otf"
          if [ ! -s "$FONT_PATH" ]; then
            echo "[remote] download Noto Sans KR..."
            curl -fsSL --retry 3 -o "$FONT_PATH" \
              https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/Korean/NotoSansKR-Regular.otf \
              || echo "[remote] WARN: noto download 실패"
          fi
          ls -lh "$FONT_PATH" 2>/dev/null || echo "[remote] no font file"

          # PIL 보장
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet Pillow

          pkill -f "uvicorn app.main:app" || true
          sleep 2
          cd backend
          nohup python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 5

          if curl -fsS http://127.0.0.1:8000/healthz > /tmp/health.json; then
            echo "[remote] healthz: \$(cat /tmp/health.json | head -c 200)"
          else
            echo "[remote] ❌ uvicorn 기동 실패"
            tail -n 80 uvicorn.log
            exit 1
          fi

          echo "[remote] ✅ deploy ok"
          REMOTE
