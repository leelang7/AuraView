name: Deploy

# main / feat/k-perception 브랜치 push 시 EC2 SSH 로 자동 배포.
# 활성화 조건: GitHub repo Settings → Secrets 에 다음 4개 등록 필요
#   EC2_HOST       예: 13.48.70.193
#   EC2_USER       예: ubuntu
#   EC2_SSH_KEY    EC2 접속용 private key 전체 (-----BEGIN ...-----END ...-----)
#   DEPLOY_PATH    예: /home/ubuntu/AuraView
#
# 4개가 모두 설정돼야 step 이 실행됩니다 (없으면 경고 후 skip).

on:
  push:
    branches: [main, feat/k-perception]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH → git pull → restart uvicorn
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets present
        id: gate
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::warning::EC2 deploy secrets not set — skipping. Add EC2_HOST, EC2_USER, EC2_SSH_KEY, DEPLOY_PATH to enable."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Debug secret format (no leak)
        if: steps.gate.outputs.skip == 'false'
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # 값 자체는 GitHub 가 자동 마스킹 — 줄수·길이·BEGIN/END 존재 여부만 확인.
          lines=$(printf '%s\n' "$KEY" | wc -l)
          chars=$(printf '%s' "$KEY" | wc -c)
          first=$(printf '%s' "$KEY" | head -1 | head -c 30)
          last=$(printf '%s' "$KEY" | tail -1 | head -c 30)
          echo "EC2_SSH_KEY lines=$lines chars=$chars"
          echo "first line preview (will be ***-masked if it contains the secret value):"
          echo "  $first"
          echo "last line preview:"
          echo "  $last"
          if printf '%s' "$KEY" | grep -q "BEGIN"; then echo "✓ has BEGIN marker"; else echo "✗ NO BEGIN marker — 키 형식 깨짐"; fi
          if printf '%s' "$KEY" | grep -q "END"; then echo "✓ has END marker"; else echo "✗ NO END marker — 키 형식 깨짐"; fi
          # 정상: 26~28 lines, 1600~1800 chars, BEGIN/END 둘 다 있음
          [ "$lines" -lt 5 ] && echo "::warning::EC2_SSH_KEY 가 한 줄로 들어옴 — 줄바꿈이 사라진 상태일 가능성"
          true

      - name: SSH deploy
        if: steps.gate.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "→ pulling ${GITHUB_REF##*/}"
            git fetch --all
            git checkout ${GITHUB_REF##*/}
            git pull origin ${GITHUB_REF##*/}
            python3 -m pip install -r requirements.txt --quiet
            pkill -f "uvicorn app.main:app" || true
            sleep 2
            cd backend
            nohup python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
            sleep 4
            curl -fsS http://127.0.0.1:8000/ | head -c 100 || (echo "❌ uvicorn 기동 실패" && tail -n 60 uvicorn.log && exit 1)
            echo "✅ deploy ok"
