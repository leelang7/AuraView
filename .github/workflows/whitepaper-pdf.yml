name: Whitepaper PDF

# docs/WHITEPAPER_KR.md 가 main 에서 변경될 때마다 PDF 빌드 → 같은 PR/commit 에 결과물 첨부.
# WeasyPrint 가 Linux runner 에서는 안정적으로 동작.

on:
  push:
    branches: [main]
    paths:
      - "docs/WHITEPAPER_KR.md"
      - "docs/PRESS_KIT.md"
      - "scripts/build-whitepaper-pdf.py"
      - ".github/workflows/whitepaper-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system fonts (한글)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WeasyPrint
        run: python -m pip install --quiet weasyprint

      - name: Build PDF
        run: python scripts/build-whitepaper-pdf.py

      - name: Upload Whitepaper artifact
        uses: actions/upload-artifact@v4
        with:
          name: WHITEPAPER_KR
          path: |
            docs/WHITEPAPER_KR.pdf
            docs/WHITEPAPER_KR.html
          if-no-files-found: warn
          retention-days: 90

      - name: Upload PRESS_KIT artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRESS_KIT
          path: |
            docs/PRESS_KIT.pdf
            docs/PRESS_KIT.html
          if-no-files-found: warn
          retention-days: 90

      # 공개 다운로드 — "latest" 릴리즈에 PDF 첨부 (인증 없이 다운로드 가능)
      - name: stage release assets
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release_assets
          cp docs/WHITEPAPER_KR.pdf release_assets/AuraView_Whitepaper.pdf 2>/dev/null || true
          cp docs/PRESS_KIT.pdf     release_assets/AuraView_PressKit.pdf  2>/dev/null || true
          ls -lh release_assets/ || true

      - name: publish to "latest" release (PDF)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AuraView Fleet · Latest Build
          body: |
            가장 최신 빌드 — Native APK + Whitepaper / Press Kit PDF.

            **공개 다운로드 (인증 불요)**:
            - APK: <https://github.com/leelang7/AuraView/releases/latest/download/auraview_fleet.apk>
            - Whitepaper: <https://github.com/leelang7/AuraView/releases/latest/download/AuraView_Whitepaper.pdf>
            - Press Kit: <https://github.com/leelang7/AuraView/releases/latest/download/AuraView_PressKit.pdf>
          files: |
            release_assets/AuraView_Whitepaper.pdf
            release_assets/AuraView_PressKit.pdf
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
