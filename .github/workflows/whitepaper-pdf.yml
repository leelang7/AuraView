name: Whitepaper PDF

# docs/WHITEPAPER_KR.md 가 main 에서 변경될 때마다 PDF 빌드 → 같은 PR/commit 에 결과물 첨부.
# WeasyPrint 가 Linux runner 에서는 안정적으로 동작.

on:
  push:
    branches: [main]
    paths:
      - "docs/WHITEPAPER_KR.md"
      - "scripts/build-whitepaper-pdf.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system fonts (한글)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WeasyPrint
        run: python -m pip install --quiet weasyprint

      - name: Build PDF
        run: python scripts/build-whitepaper-pdf.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WHITEPAPER_KR
          path: |
            docs/WHITEPAPER_KR.pdf
            docs/WHITEPAPER_KR.html
          if-no-files-found: warn
          retention-days: 90
