name: auraview_fleet
description: "AuraView Fleet — Tesla-style shadow-mode dashcam contribution client"
publish_to: 'none'
version: 12.165.0+12165

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Camera + media
  camera: ^0.11.2
  # v12.7 2026-05-19: Galaxy Z Fold 3 + camera_android(camera2) → frame 콜백 안 옴 버그.
  # camera_android_camerax 로 강제 교체 (CameraX 기반 — 최신 단말 호환 더 좋음).
  camera_android_camerax: ^0.6.30
  path_provider: ^2.1.4
  image: ^4.5.4

  # Network
  http: ^1.2.2

  # Permissions / location
  permission_handler: ^11.3.1
  geolocator: ^13.0.1

  # State helpers
  shared_preferences: ^2.3.2

  # On-device object detection (LIVE 모드 사람/차량/이륜 실 인식)
  google_mlkit_object_detection: ^0.14.0
  google_mlkit_commons: ^0.9.0
  # v12.9 2026-05-19: ImageLabeler 추가 (ObjectDetector base 모델이 일반 객체 못 잡는 한계 보완)
  google_mlkit_image_labeling: ^0.13.0

  # v7 2026-05-18: AuraView 자체 3D BEV WebView 임베드 (Three.js + getUserMedia)
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
