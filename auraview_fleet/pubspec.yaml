name: auraview_fleet
description: "AuraView Fleet — Tesla-style shadow-mode dashcam contribution client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Camera + media
  camera: ^0.11.2
  path_provider: ^2.1.4
  image: ^4.5.4

  # Network
  http: ^1.2.2

  # Permissions / location
  permission_handler: ^11.3.1
  geolocator: ^13.0.1

  # State helpers
  shared_preferences: ^2.3.2

  # On-device object detection (LIVE 모드 사람/차량/이륜 실 인식)
  google_mlkit_object_detection: ^0.14.0
  google_mlkit_commons: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
