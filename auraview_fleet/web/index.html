<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00c8ff">
  <meta name="description" content="AuraView Fleet — Tesla-style shadow-mode dashcam contribution client">

  <!-- iOS / mobile -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AuraView Fleet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>AuraView Fleet · 카메라 기여 단말</title>

  <style>
    html, body { margin:0; padding:0; height:100%; background:#080c14; color:#e2eaf5;
                 font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif; }
    #splash { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
              flex-direction:column; gap:14px; background:#080c14; transition:opacity .3s; z-index:9999; }
    #splash .ring { width:48px; height:48px; border-radius:50%;
                    border:3px solid rgba(0,200,255,.15); border-top-color:#00c8ff;
                    animation:spin .8s linear infinite; }
    #splash .label { color:#00c8ff; font-family:ui-monospace,monospace; font-size:11px; letter-spacing:3px; }
    #splash.fade { opacity:0; pointer-events:none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="ring"></div>
    <div class="label">AURAVIEW FLEET LOADING…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const s = document.getElementById('splash');
      if (s) { s.classList.add('fade'); setTimeout(()=>s.remove(), 400); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
