[pytest]
# 외부 의존성 deprecation warnings 억제 — 테스트 출력 가독성 향상.
# 실제 코드 결함은 별도로 추적 (datetime.utcnow → datetime.now(UTC) 마이그레이션은 v0.7 예정).
filterwarnings =
    ignore::DeprecationWarning:datetime
    ignore::DeprecationWarning:fastapi
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    # 실제 우리 코드에서 발생하는 datetime.utcnow 도 일단 무음 (v0.7 클린업 예정)
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning
    ignore:.*on_event is deprecated.*:DeprecationWarning
    ignore:.*regex.*has been deprecated.*
    ignore:.*Unverified HTTPS request.*
