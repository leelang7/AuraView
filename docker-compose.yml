# AuraView 로컬·검증 환경 한 줄 가동
#   docker compose up -d              # 백엔드 + nginx (HTTPS 필요시 외부 reverse-proxy)
#   docker compose logs -f auraview
#   docker compose down
#
# 환경변수: .env (없으면 .env.example 참고)
# 포트: 호스트 8000 → 컨테이너 8000

services:
  auraview:
    build:
      context: .
      dockerfile: Dockerfile
    image: auraview/k-perception:latest
    container_name: auraview
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ALLOW_FALLBACK: "1"
      PUBLIC_API_TIMEOUT: "3.0"
      ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      # 업로드·생성 영상·리포트는 호스트에 보존
      - ./_data/uploads:/app/backend/uploads
      - ./_data/dsz_exports:/app/dsz_exports
      # RAG 모델 캐시 + 인덱스 — 컨테이너 재시작 시 재다운로드 방지
      - ./_data/hf-cache:/models/hf-cache
      - ./_data/qa-index:/models/qa
    networks: [auraview-net]

  # ──────────────────────────────────────────────────────────────────
  # (선택) GPU 빌드 — Qwen2.5-7B + bge-m3 + reranker (RAG)
  # 사용: docker compose --profile gpu up -d auraview-gpu
  # 요구: NVIDIA Container Toolkit (nvidia-docker) 설치
  # ──────────────────────────────────────────────────────────────────
  auraview-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_LLM: "true"
    image: auraview/k-perception:gpu
    container_name: auraview-gpu
    profiles: ["gpu"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ALLOW_FALLBACK: "1"
      ALLOWED_ORIGINS: "*"
      QA_DEVICE: "cuda"
      QA_LLM_4BIT: "1"
      QA_AUTOSEED_ON_BOOT: "1"     # 부팅 시 자체 docs 자동 인덱싱
      HF_HOME: "/models/hf-cache"
    ports:
      - "8001:8000"
    volumes:
      - ./_data/uploads:/app/backend/uploads
      - ./_data/dsz_exports:/app/dsz_exports
      - ./_data/hf-cache:/models/hf-cache
      - ./_data/qa-index:/models/qa
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # 또는 1
              capabilities: [gpu]
    networks: [auraview-net]

  # (선택) 발표·시연용 정적 nginx — auraview/k-perception 컨테이너 앞에서 캐싱 + 압축
  nginx:
    image: nginx:1.27-alpine
    container_name: auraview-nginx
    profiles: ["edge"]            # `docker compose --profile edge up` 으로 활성화
    ports:
      - "80:80"
    depends_on: [auraview]
    volumes:
      - ./scripts/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [auraview-net]
    restart: unless-stopped

networks:
  auraview-net:
    driver: bridge
