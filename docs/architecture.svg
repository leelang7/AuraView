<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Noto Sans KR, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#00c8ff" opacity="0.85"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#a995ff" opacity="0.85"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-family="Black Han Sans" font-size="30" fill="#e2eaf5">
    AuraView · K-Perception Architecture
  </text>
  <text x="600" y="72" text-anchor="middle" font-size="13" fill="#5a7a9a" letter-spacing="3">
    EDGE  ·  V2V POOL  ·  CLOUD  ·  PUBLIC DATA
  </text>

  <!-- ───────── EDGE column ───────── -->
  <g>
    <rect x="40" y="110" width="320" height="540" rx="14" fill="#0d1520" stroke="#00c8ff" stroke-opacity="0.25"/>
    <text x="60" y="138" font-size="11" fill="#00c8ff" letter-spacing="3" font-family="JetBrains Mono">// EDGE · 차량·블랙박스·폰</text>

    <!-- Camera -->
    <rect x="60" y="160" width="280" height="50" rx="8" fill="#172035" stroke="#00c8ff" stroke-opacity="0.3"/>
    <text x="200" y="185" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">📷 Camera (블랙박스 / Flutter)</text>
    <text x="200" y="201" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">JPEG @ 4s tick · entropy + motion</text>

    <!-- HydraNet -->
    <rect x="60" y="232" width="280" height="50" rx="8" fill="#172035" stroke="#00c8ff" stroke-opacity="0.3"/>
    <text x="200" y="257" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">🧠 HydraNet 멀티태스크</text>
    <text x="200" y="273" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">vehicle · VRU · signal · lane · sign</text>

    <!-- Occupancy -->
    <rect x="60" y="304" width="280" height="50" rx="8" fill="#172035" stroke="#00c8ff" stroke-opacity="0.3"/>
    <text x="200" y="329" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">🌐 Occupancy Network (BEV)</text>
    <text x="200" y="345" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">40m × 40m × 0.5m voxel · unknown shadow</text>

    <!-- Intent -->
    <rect x="60" y="376" width="280" height="50" rx="8" fill="#172035" stroke="#00c8ff" stroke-opacity="0.3"/>
    <text x="200" y="401" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">🚶 Intent Predictor</text>
    <text x="200" y="417" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">가려진 보행자·이륜 경로 분포</text>

    <!-- E2E Risk Transformer -->
    <rect x="60" y="448" width="280" height="56" rx="8" fill="url(#accent)" opacity="0.18" stroke="url(#accent)" stroke-width="2"/>
    <text x="200" y="475" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="900">⚡ E2E Risk Transformer</text>
    <text x="200" y="492" text-anchor="middle" font-size="10" fill="#a995ff" font-family="JetBrains Mono">trained · AUC 0.93+ · 5초 충돌 확률</text>

    <!-- HUD -->
    <rect x="60" y="528" width="280" height="50" rx="8" fill="#172035" stroke="#00e09a" stroke-opacity="0.4"/>
    <text x="200" y="553" text-anchor="middle" font-size="14" fill="#00e09a" font-weight="700">🔔 HUD + Audio Alert</text>
    <text x="200" y="569" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">5.7s 평균 lead time · procedural beep</text>

    <!-- V2V broadcast out -->
    <rect x="60" y="600" width="280" height="34" rx="8" fill="#172035" stroke="#a995ff" stroke-opacity="0.5" stroke-dasharray="4,3"/>
    <text x="200" y="622" text-anchor="middle" font-size="11" fill="#a995ff" font-family="JetBrains Mono">📡 V2V broadcast → 풀</text>

    <!-- vertical arrows -->
    <path d="M200,210 L200,232" stroke="#00c8ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M200,282 L200,304" stroke="#00c8ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M200,354 L200,376" stroke="#00c8ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M200,426 L200,448" stroke="#00c8ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M200,504 L200,528" stroke="#00c8ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M200,578 L200,600" stroke="#a995ff" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- ───────── V2V POOL center ───────── -->
  <g>
    <rect x="420" y="180" width="360" height="180" rx="14" fill="#0a0518" stroke="#a995ff" stroke-opacity="0.45" stroke-width="2"/>
    <text x="440" y="208" font-size="11" fill="#a995ff" letter-spacing="3" font-family="JetBrains Mono">// V2V POOL · 교차로별</text>
    <text x="600" y="246" text-anchor="middle" font-family="Black Han Sans" font-size="22" fill="#e2eaf5">⭐ Cross-Vehicle Perception</text>
    <text x="600" y="276" text-anchor="middle" font-size="13" fill="#a995ff" font-weight="700">마주오는 차의 시점이 내 사각지대를 메운다</text>
    <text x="600" y="302" text-anchor="middle" font-size="11" fill="#5a7a9a" font-family="JetBrains Mono">heading diff &gt; 130° → weight 0.95</text>
    <text x="600" y="324" text-anchor="middle" font-size="11" fill="#5a7a9a" font-family="JetBrains Mono">/collab/v2v/{broadcast,intersection,fused-occupancy}</text>
    <text x="600" y="346" text-anchor="middle" font-size="11" fill="#00e09a" font-family="JetBrains Mono">Tesla 도 못 하는 한국 도로 협업</text>

    <!-- Bus + Bidir -->
    <rect x="420" y="380" width="170" height="80" rx="10" fill="#172035" stroke="#ffb020" stroke-opacity="0.4"/>
    <text x="505" y="402" text-anchor="middle" font-size="13" fill="#ffb020" font-weight="700">🚌 Bus-Aware</text>
    <text x="505" y="420" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">정류장 + 정차 상태</text>
    <text x="505" y="438" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">prior boost +0.55</text>

    <rect x="610" y="380" width="170" height="80" rx="10" fill="#172035" stroke="#ff3b3b" stroke-opacity="0.4"/>
    <text x="695" y="402" text-anchor="middle" font-size="13" fill="#ff3b3b" font-weight="700">↔️ Bidirectional</text>
    <text x="695" y="420" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">마주오는 감속 + VDS</text>
    <text x="695" y="438" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">상행/하행 비대칭</text>

    <!-- Fused -->
    <rect x="420" y="480" width="360" height="60" rx="10" fill="url(#accent)" opacity="0.20" stroke="url(#accent)" stroke-width="2"/>
    <text x="600" y="506" text-anchor="middle" font-size="15" fill="#e2eaf5" font-weight="900">⚡ Fused Occupancy + Risk Lift</text>
    <text x="600" y="526" text-anchor="middle" font-size="11" fill="#a995ff" font-family="JetBrains Mono">단독 vs 협업 · lift +10~31%p</text>

    <!-- arrows from edge to V2V -->
    <path d="M340,617 C380,617 380,260 420,260" stroke="#a995ff" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- ───────── CLOUD column ───────── -->
  <g>
    <rect x="840" y="110" width="320" height="540" rx="14" fill="#0d1520" stroke="#00e09a" stroke-opacity="0.25"/>
    <text x="860" y="138" font-size="11" fill="#00e09a" letter-spacing="3" font-family="JetBrains Mono">// CLOUD · auraview.allthatai.kr</text>

    <rect x="860" y="160" width="280" height="50" rx="8" fill="#172035" stroke="#00e09a" stroke-opacity="0.3"/>
    <text x="1000" y="185" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">📥 Fleet 하드샘플</text>
    <text x="1000" y="201" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">PII 마스킹 · HMAC 가명화</text>

    <rect x="860" y="232" width="280" height="50" rx="8" fill="#172035" stroke="#00e09a" stroke-opacity="0.3"/>
    <text x="1000" y="257" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">🔁 자동 재학습 + OTA</text>
    <text x="1000" y="273" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">PyTorch Transformer · 가중치 배포</text>

    <rect x="860" y="304" width="280" height="50" rx="8" fill="#172035" stroke="#00e09a" stroke-opacity="0.3"/>
    <text x="1000" y="329" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">🔒 안심구역 결합분석</text>
    <text x="1000" y="345" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">TAAS × VDS · k-익명성 = 5</text>

    <rect x="860" y="376" width="280" height="50" rx="8" fill="#172035" stroke="#00e09a" stroke-opacity="0.3"/>
    <text x="1000" y="401" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">📊 정책 리포트 (Top-N)</text>
    <text x="1000" y="417" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">지자체 · 도로공사 환원</text>

    <rect x="860" y="448" width="280" height="50" rx="8" fill="#172035" stroke="#a995ff" stroke-opacity="0.5"/>
    <text x="1000" y="473" text-anchor="middle" font-size="14" fill="#a995ff" font-weight="700">⭐ K-MaaS 연계</text>
    <text x="1000" y="489" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">시민 우회 + 운영팀 환원</text>

    <rect x="860" y="520" width="280" height="50" rx="8" fill="#172035" stroke="#00c8ff" stroke-opacity="0.3"/>
    <text x="1000" y="545" text-anchor="middle" font-size="14" fill="#e2eaf5" font-weight="700">🎬 Reenactment + Showreel</text>
    <text x="1000" y="561" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono">1080p 24fps · 음향 + V2V 시연</text>

    <rect x="860" y="592" width="280" height="40" rx="8" fill="#0a1624" stroke="#5a7a9a" stroke-opacity="0.3"/>
    <text x="1000" y="616" text-anchor="middle" font-size="11" fill="#5a7a9a" font-family="JetBrains Mono">9탭 대시보드 + Slides + Kiosk + Submission</text>

    <!-- vertical arrows -->
    <path d="M1000,210 L1000,232" stroke="#00e09a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1000,282 L1000,304" stroke="#00e09a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1000,354 L1000,376" stroke="#00e09a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1000,426 L1000,448" stroke="#00e09a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1000,498 L1000,520" stroke="#a995ff" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

    <!-- arrow from V2V to cloud -->
    <path d="M780,260 C820,260 820,185 860,185" stroke="#a995ff" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
    <!-- arrow from edge to cloud (Fleet) -->
    <path d="M340,185 C500,185 700,80 860,170" stroke="#00e09a" stroke-width="1.5" fill="none" stroke-dasharray="2,3" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- ───────── PUBLIC DATA bar (bottom) ───────── -->
  <g>
    <rect x="40" y="680" width="1120" height="60" rx="14" fill="#0a0f18" stroke="#5a7a9a" stroke-opacity="0.3"/>
    <text x="60" y="703" font-size="11" fill="#5a7a9a" letter-spacing="3" font-family="JetBrains Mono">// 6 PUBLIC DATA SOURCES (한 응답에 결합)</text>
    <g font-size="11" fill="#c8d6ea" font-family="JetBrains Mono">
      <text x="100" y="725">신호 (B551982/rti)</text>
      <text x="290" y="725">VDS (data.ex.co.kr)</text>
      <text x="480" y="725">돌발상황</text>
      <text x="600" y="725">TAAS 사고이력</text>
      <text x="760" y="725">ITS 국가교통정보</text>
      <text x="940" y="725">안심구역 (dsz.ex.co.kr)</text>
    </g>
    <!-- arrows from public data up to cloud -->
    <path d="M600,680 L600,640" stroke="#5a7a9a" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.5"/>
  </g>

  <!-- footer -->
  <text x="600" y="753" text-anchor="middle" font-size="10" fill="#5a7a9a" font-family="JetBrains Mono" letter-spacing="2">
    auraview.allthatai.kr · github.com/leelang7/AuraView · MIT
  </text>
</svg>
