<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1100px;height:1100px;overflow:hidden;background:#04070D;
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;}
  .scene{position:relative;width:1100px;height:1100px;
    background:radial-gradient(1000px 760px at 50% 70%, #101D30 0%, #0A1322 48%, #05090F 100%);overflow:hidden;}
  .stage3d{position:absolute;inset:0;perspective:1000px;perspective-origin:50% 32%;}
  .ground{position:absolute;left:50%;top:62%;width:1700px;height:1900px;
    transform:translate(-50%,-50%) rotateX(66deg);transform-style:preserve-3d;
    background:
      repeating-linear-gradient(0deg, transparent 0 86px, rgba(86,150,205,0.09) 86px 88px),
      repeating-linear-gradient(90deg, transparent 0 86px, rgba(86,150,205,0.06) 86px 88px),
      radial-gradient(closest-side, #0B1626 0%, #060C16 100%);
    box-shadow:0 0 240px rgba(0,130,210,0.12) inset;border-radius:6px;}
  /* 도로 + 차선 */
  .road{position:absolute;left:50%;top:0;width:560px;height:1900px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,#0F1A2A 10%,#121F31 90%,transparent);}
  .lane{position:absolute;top:0;height:1900px;}
  .lane.c{left:50%;width:7px;transform:translateX(-50%);
    background:repeating-linear-gradient(0deg,#E8C24A 0 64px,transparent 64px 150px);box-shadow:0 0 16px rgba(232,194,74,.6);}
  .lane.l{left:26%;width:4px;background:repeating-linear-gradient(0deg,rgba(200,230,255,.5) 0 50px,transparent 50px 130px);}
  .lane.r{right:26%;width:4px;background:repeating-linear-gradient(0deg,rgba(200,230,255,.5) 0 50px,transparent 50px 130px);}
  .edge{position:absolute;top:0;width:5px;height:1900px;background:rgba(110,200,255,.55);box-shadow:0 0 22px rgba(0,200,255,.6);}
  /* 횡단보도 */
  .crosswalk{position:absolute;left:50%;top:430px;transform:translateX(-50%);width:560px;height:90px;
    background:repeating-linear-gradient(90deg, rgba(230,240,255,.85) 0 36px, transparent 36px 72px);opacity:.85;}
  /* 객체 (top-view 실루엣) */
  .veh{position:absolute;border-radius:22px 22px 18px 18px;}
  .veh::before{content:'';position:absolute;left:16%;right:16%;top:20%;height:34%;border-radius:10px;background:rgba(0,0,0,.28);}
  .veh::after{content:'';position:absolute;left:22%;right:22%;bottom:12%;height:16%;border-radius:6px;background:rgba(255,255,255,.14);}
  .hud{position:absolute;inset:0;pointer-events:none;}
  .alert{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:rgba(255,55,55,.18);
    border:1.5px solid rgba(255,90,90,.65);color:#FFAAAA;padding:14px 28px;border-radius:99px;font-size:25px;font-weight:800;
    box-shadow:0 0 44px rgba(255,55,55,.28);font-family:'Pretendard',sans-serif;}
  .occ{position:absolute;left:50%;top:24%;transform:translateX(-50%);text-align:center;}
  .occ .t{font-size:25px;font-weight:800;color:#FF8A8A;text-shadow:0 0 22px rgba(255,80,80,.7);}
  .occ .s{font-size:16px;color:#FFC4C4;margin-top:4px;font-weight:600;}
  .spd{position:absolute;left:50px;bottom:80px;}
  .spd .v{font-size:76px;font-weight:900;color:#fff;line-height:.85;}
  .spd .u{font-size:19px;color:#8FA8BC;letter-spacing:3px;}
  .gauge{position:absolute;right:50px;bottom:80px;text-align:right;}
  .gauge .lab{font-size:17px;color:#8FA8BC;letter-spacing:3px;font-weight:700;}
  .gauge .val{font-size:84px;font-weight:900;color:#FF6B6B;line-height:.82;text-shadow:0 0 44px rgba(255,107,107,.55);}
  .gauge .sub{font-size:16px;color:#9FB4C4;font-weight:600;}
  .tag{position:absolute;font-size:15px;font-weight:800;color:#cfe8f5;background:rgba(8,14,22,.7);
    padding:4px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.14);}
</style></head><body>
<div class="scene">
  <div class="stage3d"><div class="ground">
    <div class="road">
      <div class="edge" style="left:0"></div><div class="edge" style="right:0"></div>
      <div class="lane c"></div><div class="lane l"></div><div class="lane r"></div>
      <div class="crosswalk"></div>

      <!-- occlusion shadow (트럭 뒤 = 먼 쪽) -->
      <div style="position:absolute;left:50%;top:60px;transform:translateX(-50%);width:600px;height:470px;
        background:radial-gradient(ellipse 52% 88% at 50% 100%, rgba(255,55,55,.42), rgba(255,95,45,.16) 46%, transparent 72%);filter:blur(4px);"></div>
      <!-- 숨은 보행자 -->
      <div style="position:absolute;left:56%;top:300px;width:42px;height:42px;border-radius:50%;
        background:rgba(255,110,110,.95);box-shadow:0 0 28px rgba(255,80,80,.9);"></div>
      <div style="position:absolute;left:56.4%;top:344px;width:34px;height:64px;border-radius:16px;
        border:2px dashed rgba(255,160,160,.95);background:rgba(255,80,80,.22);"></div>

      <!-- 예측 경로 EGO→정지 -->
      <div style="position:absolute;left:50%;top:720px;transform:translateX(-50%);width:104px;height:470px;border-radius:52px;
        background:linear-gradient(0deg, rgba(0,200,255,.42), rgba(0,200,255,.03));box-shadow:0 0 34px rgba(0,200,255,.25);"></div>

      <!-- 트럭 (cab+trailer) -->
      <div style="position:absolute;left:50%;top:540px;transform:translateX(-50%);width:250px;">
        <div style="height:118px;border-radius:16px 16px 5px 5px;background:linear-gradient(180deg,#83909F,#525E6D);box-shadow:0 10px 30px rgba(0,0,0,.55);"></div>
        <div style="height:300px;margin-top:5px;border-radius:5px 5px 14px 14px;background:linear-gradient(180deg,#646F7E,#39424F);box-shadow:0 0 0 2px rgba(255,255,255,.07) inset,0 14px 46px rgba(0,0,0,.6);"></div>
      </div>
      <!-- 마주오는 차 (반대 차로) -->
      <div class="veh" style="left:30%;top:250px;width:128px;height:230px;background:linear-gradient(180deg,#C56A6A,#7A3838);"></div>
      <!-- 좌측 차 -->
      <div class="veh" style="left:20%;top:820px;width:150px;height:260px;background:linear-gradient(180deg,#6A7585,#3A434F);"></div>
      <!-- EGO -->
      <div style="position:absolute;left:50%;top:1230px;transform:translateX(-50%);width:188px;">
        <div style="height:118px;border-radius:26px 26px 8px 8px;background:linear-gradient(180deg,#A6ECFF,#3FC9FF);"></div>
        <div style="height:200px;margin-top:4px;border-radius:8px 8px 24px 24px;background:linear-gradient(180deg,#37C8FF,#0A6FB0);box-shadow:0 0 90px rgba(0,200,255,.7),0 0 0 2px rgba(180,240,255,.5) inset;"></div>
      </div>
    </div></div>
    <!-- depth fog top -->
    <div style="position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,#05090F,transparent);"></div>
  </div>

  <div class="hud">
    <div class="alert">🚨 사각지대 보행자 가능 — 즉시 감속</div>
    <div class="occ"><div class="t">← occlusion shadow 계산</div><div class="s">트럭 뒤 보행자 확률 0.55</div></div>
    <div class="tag" style="left:300px;top:300px;">↑ 마주오는 차</div>
    <div class="tag" style="left:64px;top:560px;">트럭 · 시야 가림</div>
    <div class="spd"><div class="v">38</div><div class="u">KM / H</div></div>
    <div class="gauge"><div class="lab">FUSION RISK</div><div class="val">0.68</div><div class="sub">충돌 확률 · 3.38초 선행 경고</div></div>
  </div>
</div>
</body></html>
