<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>AuraView 3D BEV — 실시간 카메라</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;color:#fff;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  /* 상단 HUD */
  #hud-top{position:fixed;top:0;left:0;right:0;padding:14px 16px;z-index:30;
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(to bottom,rgba(0,0,0,0.7),transparent);pointer-events:none;}
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:1px;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:#00E09A;box-shadow:0 0 8px #00E09A;}
  .brand .pill{padding:3px 8px;background:rgba(0,224,154,0.18);color:#00E09A;border-radius:99px;font-size:10px;}
  #fps{font-family:monospace;font-size:11px;color:#7CC8B0;opacity:0.85;}
  /* AI 검출 상태 배지 (모델 로드 / 검출 카운트 / 백엔드) */
  #ai-status{position:fixed;top:42px;right:14px;z-index:30;padding:4px 10px;
    background:rgba(10,14,24,0.8);backdrop-filter:blur(6px);border:1px solid rgba(0,200,255,0.30);
    border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:0.5px;
    display:flex;align-items:center;gap:6px;pointer-events:none;color:#7CC8B0;}
  #ai-status .led{width:7px;height:7px;border-radius:50%;background:#FFB020;box-shadow:0 0 6px #FFB020;
    animation:pulse 1.2s infinite;}
  #ai-status.ready .led{background:#00E09A;box-shadow:0 0 6px #00E09A;animation:none;}
  #ai-status.err .led{background:#FF4040;box-shadow:0 0 6px #FF4040;animation:none;}
  #ai-status.ready{border-color:rgba(0,224,154,0.45);color:#9CE9C9;}
  #ai-status.err{border-color:rgba(255,68,68,0.45);color:#FFB0B0;}
  /* 우상단 컨트롤 */
  #ctrls{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:31;pointer-events:auto;}
  .btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#fff;
    border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .btn:active{background:rgba(255,255,255,0.18);}
  .btn.danger{border-color:rgba(255,68,68,0.5);color:#FF6B6B;}
  /* 하단 메트릭 패널 */
  #metrics{position:fixed;left:14px;right:14px;bottom:14px;z-index:30;
    padding:12px 14px;background:rgba(10,14,24,0.78);backdrop-filter:blur(8px);
    border:1px solid rgba(0,200,255,0.25);border-radius:12px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;pointer-events:none;}
  .met{display:flex;flex-direction:column;align-items:center;}
  .met .l{font-size:9.5px;letter-spacing:1.5px;color:#7c8aa8;font-weight:700;margin-bottom:3px;}
  .met .v{font-size:18px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;}
  .met.danger .v{color:#FF6B6B}
  .met.warn .v{color:#FFB020}
  .met.safe .v{color:#00E09A}
  /* 카메라 PiP (좌상단 작게) */
  #pip{position:fixed;left:14px;top:64px;width:140px;height:100px;border-radius:10px;overflow:hidden;
    border:1.5px solid rgba(0,200,255,0.45);box-shadow:0 0 12px rgba(0,200,255,0.20);z-index:25;
    background:#000;}
  #pip video{width:100%;height:100%;object-fit:cover;}
  #pip-tag{position:absolute;top:4px;left:6px;background:rgba(0,0,0,0.8);padding:2px 7px;
    border-radius:99px;font-size:9px;font-weight:900;color:#00C8FF;letter-spacing:1px;
    display:flex;align-items:center;gap:4px;}
  #pip-tag .dot{width:5px;height:5px;border-radius:50%;background:#00E09A;
    box-shadow:0 0 4px #00E09A;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  /* 에러/안내 */
  #notice{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;
    padding:18px 22px;background:rgba(0,0,0,0.85);border-radius:12px;
    border:1px solid rgba(255,176,32,0.5);max-width:320px;text-align:center;
    font-size:13px;line-height:1.6;display:none;}
  #notice.show{display:block;}
</style>

<!-- v8 2026-05-18: 실 카메라 구동 점유 BEV — TensorFlow.js + COCO-SSD

<body>

<div id="stage"></div>

<div id="hud-top">
  <div class="brand">
    <span class="dot"></span>
    <span>AuraView</span>
    <span class="pill">3D BEV · LIVE</span>
  </div>
  <span id="fps">— fps</span>
</div>

<!-- AI 상태 (로딩 / 백엔드 / 검출 카운트) -->
<div id="ai-status"><span class="led"></span><span id="ai-text">AI 대기 중</span></div>

<script>
// v9 2026-05-18: ?embed=fleet 임베드 모드 — Flutter 메인 BEV 로 사용될 때:
//   1) Flutter native CameraController가 카메라 HW 점유 중이라 getUserMedia 충돌 → 시도 안 함
//   2) Flutter 가 별도 PiP/HUD/메트릭 표시 → WebView 외곽 chrome / PiP / metrics 모두 숨김
//   3) 3D 씬만 렌더 (서버 fusion 폴링 + Flutter 가 추후 JSChannel 로 검출 push)
window.AURA_EMBED = false;
(function () {
  const p = new URLSearchParams(location.search);
  if (p.get('embed') === 'fleet') {
    window.AURA_EMBED = true;
    document.body.classList.add('embed-fleet');
    const style = document.createElement('style');
    style.textContent = `
      .embed-fleet #hud-top { padding: 6px 10px; }
      .embed-fleet .brand span:nth-child(2) { display: none; }   /* "AuraView" 숨김 */
      .embed-fleet .brand .pill { padding: 2px 6px; font-size: 9px; }
      .embed-fleet #ctrls { display: none; }                      /* 컨트롤 숨김 (Flutter 가 처리) */
      .embed-fleet #ai-status { display: none; }                  /* AI 상태 칩 숨김 */
      .embed-fleet #pip { display: none !important; }             /* 내부 PiP 숨김 (Flutter native PiP 사용) */
      .embed-fleet #metrics { display: none; }                    /* 메트릭 패널 숨김 (Flutter HUD 사용) */
    `;
    document.head.appendChild(style);
  }
})();
</script>

<div id="ctrls">
  <button class="btn" id="btn-cam" title="카메라 토글">📷 카메라</button>
  <button class="btn" id="btn-reset" title="시점 초기화">↺</button>
</div>

<div id="pip" style="display:none">
  <video id="cam" autoplay muted playsinline></video>
  <div id="pip-tag"><span class="dot"></span>LIVE CAM</div>
</div>

<div id="metrics">
  <div class="met"><div class="l">차량 검출</div><div class="v" id="m-veh">0</div></div>
  <div class="met warn"><div class="l">보행자</div><div class="v" id="m-ped">0</div></div>
  <div class="met danger"><div class="l">위험도</div><div class="v" id="m-risk">0.00</div></div>
  <div class="met safe"><div class="l">선행 경고</div><div class="v" id="m-lead">— s</div></div>
</div>

<div id="notice"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const stage = document.getElementById('stage');
const W = () => stage.clientWidth, H = () => stage.clientHeight;

// ── Scene (도시 야경 톤)
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040712);
scene.fog = new THREE.FogExp2(0x080d18, 0.011);

// ── Camera
const camera = new THREE.PerspectiveCamera(50, W()/H(), 0.1, 500);
camera.position.set(0, 22, 28);
camera.lookAt(0, 0, 0);

// ── Renderer (v12.66 강화: 그림자 + tone mapping + HDR)
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference:'high-performance', logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

// ── Post-processing (Bloom: 네온 발광 톤)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W(), H()), 0.65, 0.3, 0.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ── Controls
const ctrls = new OrbitControls(camera, renderer.domElement);
ctrls.enableDamping = true;
ctrls.dampingFactor = 0.08;
ctrls.minDistance = 12; ctrls.maxDistance = 80;
ctrls.maxPolarAngle = Math.PI * 0.49;
ctrls.autoRotate = true;
ctrls.autoRotateSpeed = 0.25;
document.getElementById('btn-reset').onclick = () => {
  camera.position.set(0, 22, 28); ctrls.target.set(0,0,0); ctrls.update();
};

// ── Lights (v12.66: 야간 도시 톤 — hemisphere + 그림자 + rim light)
scene.add(new THREE.HemisphereLight(0x4070A0, 0x0A0F18, 0.55));
const moonLight = new THREE.DirectionalLight(0xCCDDFF, 0.9);
moonLight.position.set(25, 40, 15);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 120;
moonLight.shadow.camera.left = -60;
moonLight.shadow.camera.right = 60;
moonLight.shadow.camera.top = 60;
moonLight.shadow.camera.bottom = -60;
moonLight.shadow.bias = -0.0005;
scene.add(moonLight);
// Rim accent light (cyan)
const rimLight = new THREE.PointLight(0x00C8FF, 0.6, 80, 1.5);
rimLight.position.set(-15, 8, -20);
scene.add(rimLight);
const rimLight2 = new THREE.PointLight(0x7C3AED, 0.45, 70, 1.5);
rimLight2.position.set(20, 6, 25);
scene.add(rimLight2);

// ── Ground (아스팔트 + 메탈릭 반사 + 그림자 수신)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x080C14, roughness: 0.75, metalness: 0.15 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(120, 48, 0x183050, 0x0A1622);
grid.position.y = 0.012;
grid.material.transparent = true;
grid.material.opacity = 0.55;
scene.add(grid);

// ── v12.66: 주변 건물 array (야간 도시 — 네온 창문 발광)
function makeBuildings() {
  const g = new THREE.Group();
  const rng = (s) => { let x = s; return () => (x = (x * 16807) % 2147483647) / 2147483647; };
  const r = rng(42);
  // 도로 외곽 직사각형 영역에 건물 배치
  const zones = [
    { x0: -55, x1: -12, z0: -55, z1: -12 },
    { x0:  12, x1:  55, z0: -55, z1: -12 },
    { x0: -55, x1: -12, z0:  12, z1:  55 },
    { x0:  12, x1:  55, z0:  12, z1:  55 },
  ];
  for (const z of zones) {
    for (let i = 0; i < 22; i++) {
      const w = 3 + r() * 5;
      const d = 3 + r() * 5;
      const h = 6 + r() * 28;
      const x = z.x0 + r() * (z.x1 - z.x0 - w);
      const zp = z.z0 + r() * (z.z1 - z.z0 - d);
      const baseColor = 0x0A1622;
      const mat = new THREE.MeshStandardMaterial({
        color: baseColor, roughness: 0.65, metalness: 0.35,
        emissive: 0x00C8FF, emissiveIntensity: 0.04 + r() * 0.06,
      });
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x + w/2, h/2, zp + d/2);
      m.castShadow = true;
      m.receiveShadow = true;
      g.add(m);
      // 옥상 네온 라이트 라인
      if (r() > 0.55) {
        const lineMat = new THREE.MeshBasicMaterial({ color: r() > 0.5 ? 0x00C8FF : 0xFF4A88 });
        const line = new THREE.Mesh(new THREE.BoxGeometry(w * 0.9, 0.18, 0.18), lineMat);
        line.position.set(x + w/2, h + 0.15, zp + d/2 - d/2 + 0.2);
        g.add(line);
      }
    }
  }
  return g;
}
scene.add(makeBuildings());

// ── 도로 (가로 + 세로, 우측통행)
function makeRoad() {
  const g = new THREE.Group();
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x1A2030, roughness: 0.85 });
  const horiz = new THREE.Mesh(new THREE.PlaneGeometry(120, 16), roadMat);
  horiz.rotation.x = -Math.PI / 2; horiz.position.y = 0.02; g.add(horiz);
  const vert = new THREE.Mesh(new THREE.PlaneGeometry(16, 120), roadMat);
  vert.rotation.x = -Math.PI / 2; vert.position.y = 0.02; g.add(vert);
  // 중앙선 (노란 점선) — 가로 도로
  const yellowMat = new THREE.MeshBasicMaterial({ color: 0xFFD93D });
  for (let x = -50; x <= 50; x += 6) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.3), yellowMat);
    dash.rotation.x = -Math.PI / 2; dash.position.set(x, 0.03, 0);
    if (Math.abs(x) > 8) g.add(dash);
  }
  // 횡단보도 (한국 표준: 가로 stripe, 도로 가로지름)
  const whiteMat = new THREE.MeshBasicMaterial({ color: 0xE8E8E8 });
  for (let i = 0; i < 7; i++) {
    const stripe = new THREE.Mesh(new THREE.PlaneGeometry(12, 0.8), whiteMat);
    stripe.rotation.x = -Math.PI / 2; stripe.position.set(0, 0.04, -8 + i * 1.6);
    g.add(stripe);
  }
  return g;
}
scene.add(makeRoad());

// v12.66: 차량 복합 mesh — body lower + cabin upper + 헤드라이트 / 테일라이트 + 그림자
function makeVehicle(color, w=1.95, l=4.5, h=1.45) {
  const g = new THREE.Group();
  // 1) 차체 (lower body) — 메탈릭 paint
  const bodyMat = new THREE.MeshStandardMaterial({
    color, roughness: 0.30, metalness: 0.75,
    emissive: color, emissiveIntensity: 0.06,
  });
  const lowerH = h * 0.55;
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, lowerH, l), bodyMat);
  body.position.y = lowerH / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);
  // 2) 캐빈 (upper) — 살짝 좁고 짧게, 다크 글래스 톤
  const cabinH = h * 0.45;
  const cabinMat = new THREE.MeshPhysicalMaterial({
    color: 0x05080F, roughness: 0.12, metalness: 0.2,
    transmission: 0.6, thickness: 0.2, ior: 1.4,
  });
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(w * 0.88, cabinH, l * 0.55), cabinMat);
  cabin.position.set(0, lowerH + cabinH / 2, l * 0.05);
  cabin.castShadow = true;
  g.add(cabin);
  // 3) 헤드라이트 (전방 좌우, 발광)
  const hlMat = new THREE.MeshBasicMaterial({ color: 0xFFFFEE });
  const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 12), hlMat);
  hl1.position.set(-w/2 + 0.25, lowerH * 0.7, -l/2 + 0.1);
  g.add(hl1);
  const hl2 = hl1.clone();
  hl2.position.x = w/2 - 0.25;
  g.add(hl2);
  // 4) 테일라이트 (후방, 적색)
  const tlMat = new THREE.MeshBasicMaterial({ color: 0xFF2828 });
  const tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.16, 0.06), tlMat);
  tl1.position.set(-w/2 + 0.32, lowerH * 0.8, l/2 - 0.06);
  g.add(tl1);
  const tl2 = tl1.clone();
  tl2.position.x = w/2 - 0.32;
  g.add(tl2);
  return g;
}

// ── 내 차 (ego) — Tesla 비주얼 톤: 청록 발광 + 외곽 글로우
const ego = makeVehicle(0x00C8FF);
ego.position.set(0, 0, 3);
ego.userData.label = 'EGO';
// v12.66: ego 자체 발광 강화 (group이 되었으므로 첫 자식 body material)
ego.traverse(o => { if (o.isMesh && o.material && o.material.emissiveIntensity != null) o.material.emissiveIntensity = 0.45; });
scene.add(ego);
// ego 외곽 글로우 링
const egoGlow = new THREE.Mesh(
  new THREE.RingGeometry(1.8, 2.3, 32),
  new THREE.MeshBasicMaterial({ color: 0x00C8FF, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
);
egoGlow.rotation.x = -Math.PI / 2; egoGlow.position.y = 0.05;
scene.add(egoGlow);

// Tesla 시그니처 — ego 전방 예측 경로 (3D 화살표 strip)
function makeEgoPath() {
  const g = new THREE.Group();
  // 부드러운 강조 strip — 6개 segment
  for (let i = 0; i < 8; i++) {
    const w = 1.6 - i * 0.08, alpha = 0.55 - i * 0.06;
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, 2.0),
      new THREE.MeshBasicMaterial({ color: 0x00C8FF, transparent: true, opacity: alpha, side: THREE.DoubleSide })
    );
    m.rotation.x = -Math.PI / 2;
    m.position.set(2.5 + i * 2.4, 0.06, 0);
    g.add(m);
  }
  return g;
}
const egoPath = makeEgoPath();
egoPath.position.copy(ego.position); egoPath.position.x = 0; egoPath.position.z = 3;
scene.add(egoPath);

// ── v8: 실 카메라 검출 결과로 동적 생성되는 점유물 풀
//      class별 색/모양/실측 사이즈 (LUT)
const CLASS_LUT = {
  'person':     { color: 0xFF4040, w: 0.5,  l: 0.5,  h: 1.7, isPed: true,  label: '보행자' },
  'bicycle':    { color: 0xFFB020, w: 0.6,  l: 1.7,  h: 1.2, isPed: true,  label: '자전거' },
  'motorcycle': { color: 0xFFB020, w: 0.8,  l: 2.0,  h: 1.3, isPed: false, label: '이륜' },
  'car':        { color: 0x00C8FF, w: 1.8,  l: 4.5,  h: 1.5, isPed: false, label: '승용' },
  'bus':        { color: 0x7C3AED, w: 2.5,  l: 11.0, h: 3.0, isPed: false, label: '버스' },
  'truck':      { color: 0xFF6B6B, w: 2.4,  l: 7.0,  h: 2.6, isPed: false, label: '화물' },
};
// 검출 → 3D 객체 풀 (id → mesh, ring, label)
const occMap = new Map();   // tracker_id -> {mesh, ring, label, lastSeen, dist}
let trackId = 0;
const occGroup = new THREE.Group(); scene.add(occGroup);

// v8.1 2026-05-18: 객체 모양 살리기 — 비디오 ROI 크롭을 텍스처로 씌운 빌보드
//   BoxGeometry 대신 PlaneGeometry + 카메라 픽셀 텍스처로 실제 객체 모양 유지.
function makeOccObject(cls) {
  const lut = CLASS_LUT[cls] || CLASS_LUT['car'];
  // 1) 빌보드 (실 객체 픽셀) — width/height 는 트랙 갱신 시 box 비율에 맞춤
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = 256; cropCanvas.height = 256;
  const cropCtx = cropCanvas.getContext('2d');
  // 초기 채움 (검출 첫 프레임 전 placeholder)
  cropCtx.fillStyle = 'rgba(20,28,46,0.6)'; cropCtx.fillRect(0,0,256,256);
  cropCtx.strokeStyle = '#' + lut.color.toString(16).padStart(6,'0');
  cropCtx.lineWidth = 6; cropCtx.strokeRect(3,3,250,250);
  cropCtx.fillStyle = '#' + lut.color.toString(16).padStart(6,'0');
  cropCtx.font = 'bold 60px sans-serif'; cropCtx.textAlign='center';
  cropCtx.fillText(lut.label, 128, 145);
  const cropTex = new THREE.CanvasTexture(cropCanvas);
  cropTex.colorSpace = THREE.SRGBColorSpace;
  // SpriteMaterial — depthWrite: false 로 가까운 객체가 먼 객체를 가리지 않게
  const billMat = new THREE.SpriteMaterial({ map: cropTex, transparent: true, depthWrite: false });
  const billboard = new THREE.Sprite(billMat);
  // 초기 스케일은 LUT (트래커가 box AR 로 갱신)
  billboard.scale.set(lut.w, lut.h, 1);
  billboard.position.y = lut.h / 2;
  billboard.userData = { isCropBillboard: true };

  // 2) 그라운드 링 (점유 위치 마킹) — 클래스 색
  const ringGeo = new THREE.RingGeometry(Math.max(lut.w, lut.l) * 0.55, Math.max(lut.w, lut.l) * 0.78, 36);
  const ringMat = new THREE.MeshBasicMaterial({ color: lut.color, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05;

  // 3) 상단 라벨 (cls + 거리) — Tesla 풍 minimal
  const lc = document.createElement('canvas'); lc.width = 220; lc.height = 70;
  const lcx = lc.getContext('2d');
  const lTex = new THREE.CanvasTexture(lc); lTex.colorSpace = THREE.SRGBColorSpace;
  const labelSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: lTex, depthWrite: false }));
  labelSprite.scale.set(1.8, 0.6, 1); labelSprite.position.y = lut.h + 0.85;

  const group = new THREE.Group();
  group.add(billboard); group.add(ring); group.add(labelSprite);
  group.userData = {
    lut, cls,
    billboard, billMat, cropCanvas, cropCtx, cropTex,
    labelSprite, labelCanvas: lc, labelCtx: lcx, labelTex: lTex,
    ring, ringMat,
  };
  // 첫 라벨 그리기
  updateOccLabel(group, 0);
  return group;
}

// 박스 영역을 비디오에서 크롭 → 트랙 텍스처에 그림 + 비율 맞춰 빌보드 스케일
function updateOccCrop(group, video, box) {
  const { lut, billboard, cropCanvas, cropCtx, cropTex } = group.userData;
  // box = [x, y, w, h] in video coords
  const sx = Math.max(0, box[0]), sy = Math.max(0, box[1]);
  const sw = Math.max(2, Math.min(video.videoWidth - sx, box[2]));
  const sh = Math.max(2, Math.min(video.videoHeight - sy, box[3]));
  // 캔버스 비율 = box 비율 (왜곡 방지 — pad 처리)
  const ar = sw / sh;
  const C = 256;
  cropCanvas.width = C; cropCanvas.height = C;
  cropCtx.clearRect(0,0,C,C);
  // 비디오 ROI 를 캔버스 중앙에 비율 유지로 fit
  let dw, dh;
  if (ar >= 1) { dw = C; dh = C / ar; }
  else         { dh = C; dw = C * ar; }
  const dx = (C - dw) / 2, dy = (C - dh) / 2;
  // 어두운 배경 + 채도 강조 효과는 가벼운 outline 으로
  cropCtx.fillStyle = 'rgba(0,0,0,0)'; cropCtx.fillRect(0,0,C,C);
  try { cropCtx.drawImage(video, sx, sy, sw, sh, dx, dy, dw, dh); }
  catch (e) { /* video not ready */ }
  // 색상 outline (클래스 색)
  cropCtx.strokeStyle = '#' + lut.color.toString(16).padStart(6,'0');
  cropCtx.lineWidth = 4; cropCtx.strokeRect(dx + 2, dy + 2, dw - 4, dh - 4);
  cropTex.needsUpdate = true;
  // 빌보드 스케일을 box AR + 실측 크기로 맞춤 (가로폭 lut.w 기준)
  const targetW = lut.w * 1.05;
  const targetH = targetW / ar;
  billboard.scale.set(targetW, Math.max(0.6, Math.min(targetH, lut.h * 1.4)), 1);
  billboard.position.y = billboard.scale.y / 2;
}

function updateOccLabel(group, distM) {
  const { lut, labelCanvas: c, labelCtx: ctx, labelTex: tex } = group.userData;
  ctx.clearRect(0,0,c.width, c.height);
  // pill bg
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.beginPath();
  const r = 12;
  ctx.moveTo(r, 0); ctx.lineTo(c.width-r, 0);
  ctx.quadraticCurveTo(c.width, 0, c.width, r);
  ctx.lineTo(c.width, c.height-r);
  ctx.quadraticCurveTo(c.width, c.height, c.width-r, c.height);
  ctx.lineTo(r, c.height); ctx.quadraticCurveTo(0, c.height, 0, c.height-r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath();
  ctx.fill();
  // color stripe (left)
  ctx.fillStyle = '#' + lut.color.toString(16).padStart(6,'0');
  ctx.fillRect(0, 6, 5, c.height - 12);
  // label
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign='left';
  ctx.fillText(lut.label, 14, 28);
  // distance
  const col = distM < 6 ? '#FF6B6B' : (distM < 15 ? '#FFB020' : '#7CC8B0');
  ctx.font = 'bold 18px monospace'; ctx.fillStyle = col;
  ctx.fillText(distM.toFixed(1) + 'm', 14, 56);
  tex.needsUpdate = true;
}

// 위험 빌보드 (3D world space)
function makeRiskBillboard() {
  const c = document.createElement('canvas'); c.width = 280; c.height = 140;
  const cx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
  sprite.scale.set(4.5, 2.2, 1);
  return { sprite, canvas: c, ctx: cx, tex };
}
function drawRiskBillboard(rb, risk, ttc, action) {
  const { canvas: c, ctx, tex } = rb;
  ctx.clearRect(0,0,c.width,c.height);
  const danger = risk >= 0.6;
  const warn = risk >= 0.35;
  ctx.fillStyle = danger ? 'rgba(255,68,68,0.95)' : (warn ? 'rgba(255,176,32,0.92)' : 'rgba(0,224,154,0.85)');
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('⚠ 위험 ' + risk.toFixed(2), c.width/2, 46);
  ctx.font = '16px sans-serif';
  ctx.fillText(ttc ? (ttc.toFixed(1) + '초 안에 도달') : '안전 거리 확보', c.width/2, 80);
  ctx.font = 'bold 17px sans-serif';
  ctx.fillText(action, c.width/2, 110);
  tex.needsUpdate = true;
}
const riskBoardObj = makeRiskBillboard();
const riskBoard = riskBoardObj.sprite;
riskBoard.position.set(0, 4.0, 0);
scene.add(riskBoard);

// ── 픽셀 → 3D 월드 좌표 (단순 호모그래피)
//   가정: 폰 1.5m 높이, 약간 아래 기울임 (대시보드 마운트 풍).
//   bottom_y / video_h → 1에 가까울수록 가까움.
//   center_x → 가로 위치는 거리에 비례.
const VIDEO_H = 720, VIDEO_W = 1280;
const MAX_DIST = 35;       // 가장 먼 검출 30~35m
const MIN_DIST = 1.5;      // 가장 가까운 검출 1.5m
const LATERAL_SCALE = 0.5; // 화면 좌우 50%당 거리에 비례 lateral
function pixelToBev(box, vw, vh) {
  // box: [x, y, w, h] in pixel coords (top-left origin)
  const bx = box[0] + box[2] / 2;       // bottom-center x
  const by = box[1] + box[3];           // bottom y
  const ny = by / vh;                   // 0~1, bottom = 1
  const nx = bx / vw - 0.5;             // -0.5 ~ 0.5
  // 깊이는 ny^1.6 비선형 (원근감)
  const t = Math.max(0, Math.min(1, ny));
  const dist = MIN_DIST + (1 - Math.pow(1 - t, 1.6)) * (MAX_DIST - MIN_DIST);
  const lateral = nx * dist * 2 * LATERAL_SCALE;
  // ego 차량 좌표계: ego가 (0,0,3)에 있고 진행방향은 +x (오른쪽).
  //   카메라 정면이 ego 의 +x 방향. 그래서 검출된 forward 거리 = +x 오프셋.
  //   lateral 은 -z 방향에 매핑 (도로폭 16, 차로 폭 4m 가정).
  return {
    worldX: ego.position.x + dist,    // forward = +x
    worldZ: ego.position.z - lateral, // lateral
    dist,
  };
}

// IoU 기반 간단 트래커 (이전 검출과 위치 가까우면 같은 ID)
const TRACK_DECAY_MS = 1500;
function nearestExistingTrack(cls, worldX, worldZ) {
  let best = null, bestD = 4.0;
  for (const [id, t] of occMap.entries()) {
    if (t.cls !== cls) continue;
    const dx = t.worldX - worldX, dz = t.worldZ - worldZ;
    const d = Math.hypot(dx, dz);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}

let lastInfer = 0, INFER_MS = 220;
let lastRisk = 0, lastTTC = null, lastVehN = 0, lastPedN = 0;
async function inferFrame(now) {
  if (!camReady || !model) return;
  if (now - lastInfer < INFER_MS) return;
  lastInfer = now;
  let predictions;
  try { predictions = await model.detect(camVideo, 10); }
  catch (e) { return; }

  const vw = camVideo.videoWidth, vh = camVideo.videoHeight;
  // 오버레이 클리어
  overlayCtx.clearRect(0,0,overlayCanvas.width, overlayCanvas.height);
  overlayCtx.lineWidth = 2; overlayCtx.font = 'bold 12px sans-serif';

  let vehN = 0, pedN = 0; let minDist = Infinity; let closestIsPed = false;
  const seen = new Set();
  for (const p of predictions) {
    if (p.score < 0.45) continue;
    const cls = p.class;
    const lut = CLASS_LUT[cls];
    if (!lut) continue;
    if (lut.isPed) pedN++; else vehN++;
    const { worldX, worldZ, dist } = pixelToBev(p.bbox, vw, vh);
    if (dist < minDist) { minDist = dist; closestIsPed = lut.isPed; }

    // 트래커
    let id = nearestExistingTrack(cls, worldX, worldZ);
    let track = id != null ? occMap.get(id) : null;
    if (!track) {
      id = ++trackId;
      const obj = makeOccObject(cls);
      occGroup.add(obj);
      track = { obj, cls, worldX, worldZ, dist, lastSeen: now };
      occMap.set(id, track);
    } else {
      // smoothing
      track.worldX = track.worldX * 0.55 + worldX * 0.45;
      track.worldZ = track.worldZ * 0.55 + worldZ * 0.45;
      track.dist = dist; track.lastSeen = now;
    }
    seen.add(id);

    // 3D 갱신
    track.obj.position.x = track.worldX;
    track.obj.position.z = track.worldZ;
    updateOccCrop(track.obj, camVideo, p.bbox);   // 실 픽셀 텍스처 갱신 (모양 보존)
    updateOccLabel(track.obj, dist);

    // 박스 오버레이
    overlayCtx.strokeStyle = '#' + lut.color.toString(16).padStart(6,'0');
    overlayCtx.strokeRect(p.bbox[0], p.bbox[1], p.bbox[2], p.bbox[3]);
    overlayCtx.fillStyle = 'rgba(0,0,0,0.7)';
    overlayCtx.fillRect(p.bbox[0], p.bbox[1] - 18, Math.min(p.bbox[2], 120), 16);
    overlayCtx.fillStyle = '#fff';
    overlayCtx.fillText(lut.label + ' ' + dist.toFixed(1) + 'm', p.bbox[0] + 3, p.bbox[1] - 5);
  }
  // 안 보인 트랙은 시간 지나면 풀에서 제거
  for (const [id, t] of [...occMap.entries()]) {
    if (now - t.lastSeen > TRACK_DECAY_MS) {
      occGroup.remove(t.obj);
      const ud = t.obj.userData;
      if (ud) {
        if (ud.cropTex) ud.cropTex.dispose();
        if (ud.labelTex) ud.labelTex.dispose();
        if (ud.billMat) ud.billMat.dispose();
        if (ud.ringMat) ud.ringMat.dispose();
        if (ud.ring && ud.ring.geometry) ud.ring.geometry.dispose();
      }
      occMap.delete(id);
    }
  }

  // ── 위험도 계산: 최근접 객체까지 거리 + 클래스
  let risk = 0; let ttc = null; let action = '안전 거리 확보';
  if (isFinite(minDist)) {
    const base = closestIsPed ? Math.max(0, 1 - minDist / 20) : Math.max(0, 1 - minDist / 25);
    risk = closestIsPed ? Math.min(1, base * 1.3) : Math.min(1, base);
    // ttc — ego 60km/h 기준
    const v = 60 / 3.6; // m/s
    if (minDist > 2 && v > 0) ttc = minDist / v;
    if (risk >= 0.7) action = '즉시 정지';
    else if (risk >= 0.4) action = '감속 + 주의';
    else action = '안전 거리 확보';
  }
  lastRisk = risk; lastTTC = ttc; lastVehN = vehN; lastPedN = pedN;
  // AI 상태 배지: 검출 카운트 표시
  setAi('ready', `AI · ${aiBackend} · 검출 ${vehN + pedN}`);
  drawRiskBillboard(riskBoardObj, risk, ttc, action);
  // 빌보드 위치: 가장 가까운 점유물 위
  if (isFinite(minDist)) {
    let closestId = null, closestD = Infinity;
    for (const [id, t] of occMap.entries()) {
      if (t.dist < closestD) { closestD = t.dist; closestId = id; }
    }
    if (closestId != null) {
      const t = occMap.get(closestId);
      riskBoard.position.set(t.worldX, 3.5, t.worldZ);
    }
  } else {
    riskBoard.position.set(0, 3.8, 0);
  }
  // 메트릭 패널 갱신
  document.getElementById('m-veh').textContent = vehN;
  document.getElementById('m-ped').textContent = pedN;
  document.getElementById('m-risk').textContent = risk.toFixed(2);
  document.getElementById('m-lead').textContent = ttc ? (ttc.toFixed(1) + 's') : '— s';
}

// ── v9 JSChannel detection receiver — Flutter ML Kit 검출 결과를 받아 3D 씬에 반영
//    Flutter 가 window.aurDetect({ class, box: [x,y,w,h], score, vw, vh }) 를 setInterval 로 호출.
window.aurDetect = function (payload) {
  if (!payload || !payload.detections) return;
  const vw = payload.vw || 1280, vh = payload.vh || 720;
  const now = performance.now();
  let vehN = 0, pedN = 0; let minDist = Infinity; let closestIsPed = false;
  const seen = new Set();
  for (const d of payload.detections) {
    const cls = d.cls || 'car';
    const lut = CLASS_LUT[cls];
    if (!lut) continue;
    if (lut.isPed) pedN++; else vehN++;
    const { worldX, worldZ, dist } = pixelToBev(d.box, vw, vh);
    if (dist < minDist) { minDist = dist; closestIsPed = lut.isPed; }
    let id = nearestExistingTrack(cls, worldX, worldZ);
    let track = id != null ? occMap.get(id) : null;
    if (!track) {
      id = ++trackId;
      const obj = makeOccObject(cls);
      occGroup.add(obj);
      track = { obj, cls, worldX, worldZ, dist, lastSeen: now };
      occMap.set(id, track);
    } else {
      track.worldX = track.worldX * 0.55 + worldX * 0.45;
      track.worldZ = track.worldZ * 0.55 + worldZ * 0.45;
      track.dist = dist; track.lastSeen = now;
    }
    seen.add(id);
    track.obj.position.x = track.worldX;
    track.obj.position.z = track.worldZ;
    updateOccLabel(track.obj, dist);
  }
  // decay
  for (const [id, t] of [...occMap.entries()]) {
    if (now - t.lastSeen > TRACK_DECAY_MS) {
      occGroup.remove(t.obj);
      const ud = t.obj.userData;
      if (ud) {
        if (ud.cropTex) ud.cropTex.dispose();
        if (ud.labelTex) ud.labelTex.dispose();
        if (ud.billMat) ud.billMat.dispose();
        if (ud.ringMat) ud.ringMat.dispose();
        if (ud.ring && ud.ring.geometry) ud.ring.geometry.dispose();
      }
      occMap.delete(id);
    }
  }
  // 위험도 + 빌보드
  let risk = 0; let ttc = null; let action = '안전 거리 확보';
  if (isFinite(minDist)) {
    const base = closestIsPed ? Math.max(0, 1 - minDist / 20) : Math.max(0, 1 - minDist / 25);
    risk = closestIsPed ? Math.min(1, base * 1.3) : Math.min(1, base);
    const v = 60 / 3.6; if (minDist > 2 && v > 0) ttc = minDist / v;
    if (risk >= 0.7) action = '즉시 정지';
    else if (risk >= 0.4) action = '감속 + 주의';
  }
  drawRiskBillboard(riskBoardObj, risk, ttc, action);
  if (isFinite(minDist)) {
    let cid = null, cd = Infinity;
    for (const [id, t] of occMap.entries()) {
      if (t.dist < cd) { cd = t.dist; cid = id; }
    }
    if (cid != null) {
      const t = occMap.get(cid);
      riskBoard.position.set(t.worldX, 3.5, t.worldZ);
    }
  } else {
    riskBoard.position.set(0, 3.8, 0);
  }
  // 임베드 모드에서도 통계 노출 (Flutter HUD 에서 활용 가능)
  if (!window.AURA_EMBED) {
    const elV = document.getElementById('m-veh'); if (elV) elV.textContent = vehN;
    const elP = document.getElementById('m-ped'); if (elP) elP.textContent = pedN;
    const elR = document.getElementById('m-risk'); if (elR) elR.textContent = risk.toFixed(2);
    const elL = document.getElementById('m-lead'); if (elL) elL.textContent = ttc ? (ttc.toFixed(1) + 's') : '— s';
  }
};

// ── /fusion/intersection 폴링 (배경 데이터 — 융합 위험 prior 가산)
let fusionRiskPrior = 0;
async function pollFusion() {
  try {
    const r = await fetch('https://auraview.allthatai.kr/fusion/intersection/1007');
    if (!r.ok) return;
    const j = await r.json();
    fusionRiskPrior = (j.fusion_summary?.fusion_risk_score) ?? 0;
  } catch (e) {}
}
pollFusion();
setInterval(pollFusion, 10000);

// ── Animation loop
let last = performance.now(); let frames = 0; let fpsAcc = 0;
function tick(now) {
  if (!now) now = performance.now();
  const dt = (now - last) / 1000; last = now;
  frames++; fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    document.getElementById('fps').textContent = `${Math.round(frames / fpsAcc)} fps`;
    frames = 0; fpsAcc = 0;
  }
  // 검출 (비동기 — await 안에서 자체 throttle)
  inferFrame(now);
  riskBoard.lookAt(camera.position);
  ctrls.update();
  // v12.66: postprocessing composer 사용 (Bloom 효과 적용)
  composer.render();
  requestAnimationFrame(tick);
}
tick();

// ── Resize
window.addEventListener('resize', () => {
  camera.aspect = W() / H(); camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
  composer.setSize(W(), H());
  bloom.resolution.set(W(), H());
});
</script>
