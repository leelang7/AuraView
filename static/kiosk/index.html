<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>AuraView · Kiosk Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --accent:#00c8ff; --accent2:#7c3aed; --safe:#00e09a; --warn:#ffb020; --danger:#ff3b3b;
    --bg:#080c14; --surface:#0d1520; --text:#e2eaf5; --muted:#5a7a9a;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans KR', system-ui, sans-serif;
    overflow:hidden;
  }
  #wrap { position:relative; width:100vw; height:100vh; }
  iframe.scene {
    position:absolute; inset:0; width:100%; height:100%;
    border:none; opacity:0;
    transition: opacity 800ms ease;
  }
  iframe.scene.active { opacity:1; z-index:2; }

  /* HUD */
  .hud {
    position:absolute; top:18px; left:24px; right:24px; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none;
  }
  .brand {
    font-family:'Black Han Sans', sans-serif; font-size:22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 24px rgba(0,200,255,0.45);
  }
  .clock {
    font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:2px;
    color: var(--muted); background:rgba(8,12,20,.6); padding:6px 14px; border-radius:99px;
    border:1px solid rgba(0,200,255,0.2);
  }

  /* 캡션 카드 */
  .caption {
    position:absolute; bottom:38px; left:38px; right:38px; z-index:60;
    background: rgba(13,21,32,.88);
    border:1px solid rgba(0,200,255,0.25);
    border-radius:18px;
    padding:22px 28px;
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 48px rgba(0,0,0,0.55);
    pointer-events:none;
  }
  .caption .eyebrow {
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:4px;
    color:var(--accent); text-transform:uppercase; opacity:0.9;
  }
  .caption .title {
    font-family:'Black Han Sans', sans-serif; font-size:34px; line-height:1.1; margin-top:8px;
  }
  .caption .title em {
    font-style:normal;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .caption .desc {
    color: var(--muted); font-size:15px; line-height:1.7; margin-top:8px; max-width:880px;
  }

  /* 진행바 */
  .progress {
    position:absolute; bottom:0; left:0; right:0; height:4px; z-index:70;
    background: rgba(0,200,255,0.06);
  }
  .progress > .fill {
    height:100%; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 100ms linear;
  }

  /* Step indicator */
  .steps {
    position:absolute; top:62px; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; gap:6px; pointer-events:none;
  }
  .step {
    width:42px; height:5px; border-radius:99px; background:rgba(0,200,255,0.15);
    transition: background 300ms;
  }
  .step.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .step.done   { background: rgba(0,200,255,0.45); }

  /* Splash */
  #splash {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; background:var(--bg); z-index:1000;
    transition: opacity 600ms; opacity:1;
  }
  #splash.fade { opacity:0; pointer-events:none; }
  #splash .ring {
    width:64px; height:64px; border-radius:50%;
    border:4px solid rgba(0,200,255,0.15); border-top-color:var(--accent);
    animation: spin .9s linear infinite;
  }
  #splash h1 { font-family:'Black Han Sans', sans-serif; font-size:42px; }
  #splash h1 em {
    font-style:normal;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 컨트롤 (마우스 호버 시만 노출) */
  #controls {
    position:absolute; top:18px; right:24px; z-index:200;
    display:flex; gap:8px;
    opacity:0; transition: opacity .25s;
  }
  body:hover #controls, #controls:hover { opacity:1; }
  #controls button {
    background: rgba(13,21,32,.8); color: var(--text); border:1px solid rgba(0,200,255,0.25);
    border-radius:10px; padding:8px 14px; font-size:12px; cursor:pointer;
    font-family: 'JetBrains Mono', monospace; letter-spacing:1px;
  }
  #controls button:hover { background: rgba(0,200,255,0.12); }
</style>
</head>
<body>

<div id="splash">

    },
    {
      url: '/ui#tab8',
      ms: 14000,
      eye: '// 07 · POLICY REPORT',
      title: '<em>데이터로</em> 정책을 바꾼다',
      desc: '위험 교차로 Top-N 자동 리포트 (HTML+JSON). 지자체 · 한국도로공사 · K-MaaS 환원용.',
    },
    {
      url: '/ui#tab5',
      ms: 14000,
      eye: '// 08 · CAPABILITY MATRIX',
      title: '기능 <em>매트릭스</em>',
      desc: 'AI 학습/분석 + 데이터 융합 + 가명결합 + 안심구역 + K-MaaS — 라이브 카운터로 모든 모듈을 한눈에.',
    },
    {
      url: '/ui#tab9',
      ms: 18000,
      eye: '// 09 · V2V COLLABORATIVE PERCEPTION',
      title: '⭐ <em>마주오는 차의 시점</em>으로 사각지대를',
      desc: 'Tesla 도 못 하는 한국 도로 협업 인지. 같은 교차로의 다른 차량과 V2V 풀로 시점을 공유 — 단독 인지 대비 위험 감지 lift +10~31%p.',
    },
    {
      url: '/ui#tab10',
      ms: 14000,
      eye: '// 10 · PUBLIC DATA LIVE · 23 SOURCES ★',
      title: '25종 공공데이터 <em>실시간 freshness</em> ★ v10',
      desc: '신호·VDS·돌발·TAAS·ITS·DSZ·KMA·NEDIS·따릉이·스쿨존·결빙·보행·PM10·통학로·EV·RWIS·KOTSA·DTG·119·노후·V2X·단속·횡단 — 어떤 게 live, 어떤 게 stub 인지 3초 주기 모니터. 23 어댑터 모두 mode + age 즉시 노출.',
    },
    {
      url: '/fusion/intersection/1007',
      ms: 12000,
      eye: '// 10b · 23-SOURCE JSON · DIRECT ★',
      title: '<em>23-source 융합 JSON</em> 직접 호출',
      desc: '/fusion/intersection/1007 — sources_fused=25, schema=fusion.v11-2026.05.25-25src. 단 한 줄로 25개 공공 API 결합 (국내공공 23 + 보조 2) + 위치 인식 stub (gps-* 임의 위치 거짓 알람 차단) + USGS 지진/OSM 철도건널목 신규.',
    },

      url: '/collab/bus-live?lat=37.5651&lon=127.0073&radius_m=200',
      ms: 10000,
      eye: '// 10c · BIS LIVE BUS ★ v0.8.1',
      title: '<em>BIS 실시간 버스 위치</em> — Tesla 가 못 하는 한국 V2X',
      desc: '서울 BIS API 시도 → fallback fixture. 반경 200m 내 stopFlag(정차/주행) + 노선·속도. bus_aware.analyze() 가 dwelling/departing 정확도 +5~12%p 상승.',
    },
    {
      url: '/ai/v1-vs-v2',
      ms: 12000,
      eye: '// 10d · V1 vs V2 · TRAINING DELTA ★',
      title: '<em>v1 (10-feature)</em> ↔ <em>v2 (13-feature 9-source)</em>',
      desc: 'AI활용 학습 5점 증빙 강화 — 두 체크포인트 비교. v2 = weather_wet_boost + er_load + bike_lane_boost 신규 3 feature 추가. notebooks/train_risk_transformer_v2_9src.py 실행 후 자동 노출.',
    },
    {
      url: '/competition/',
      ms: 18000,
      eye: '// 11 · SYSTEM HUB ⭐',
      title: '프로젝트 <em>1-step 검증</em> 허브',
      desc: 'KPI 4종 + 검증 URL 11개 + 라이브 데모 5종 + 8 시나리오 + 문서 5종 — 한 페이지 모두. /metrics/manifest 의 시각적 뷰.',
    },
    {
      url: '/metrics/competition',
      ms: 12000,
      eye: '// 11b · COMPETITION KPI · JSON',
      title: '통합 <em>KPI · 한 응답</em>',
      desc: '모델(AUC 0.94 · F1 0.94 · p99 1.04ms) + 임팩트(연간 21명/2,370명) + 공공데이터(25종) + 검증(119 pytest) — 4축 단일 JSON.',
    },
    {
      url: '/policy/laws',
      ms: 14000,
      eye: '// 11b · KOREAN TRAFFIC LAWS',
      title: '<em>도로교통법 조항</em>·대법원 판례 매핑',
      desc: '8 시나리오 모두 — 도로교통법 5/12/13/19/25/27/48조 + 어린이안전특별법(민식이법) + 자전거이용활성화법 + 대법원 판례 인용. 법적 정당성 즉시 검증.',
    },

      ms: 24000,
      eye: '// 12 · DECK',

      desc: '14장 — 8 시나리오 매트릭스 + 검증 카드 포함. 클릭 시 화살표로 직접 이동.',
    },

  let idx = 0;
  let paused = false;
  let timer = null;
  let progTimer = null;
  let activeFrame = 'A';
  let preloading = false;

  const frA = document.getElementById('scA');
  const frB = document.getElementById('scB');
  const capE = document.getElementById('capEyebrow');
  const capT = document.getElementById('capTitle');
  const capD = document.getElementById('capDesc');
  const prog = document.getElementById('prog');
  const stepsWrap = document.getElementById('steps');

  // 스텝 인디케이터 빌드
  SCENES.forEach((_, i) => {
    const s = document.createElement('div');
    s.className = 'step';
    s.id = `step-${i}`;
    stepsWrap.appendChild(s);
  });

  function render(i) {
    const sc = SCENES[i];
    capE.innerHTML = sc.eye;
    capT.innerHTML = sc.title;
    capD.textContent = sc.desc;

    const targetFrame = activeFrame === 'A' ? frB : frA;
    const currentFrame = activeFrame === 'A' ? frA : frB;
    targetFrame.src = sc.url;
    targetFrame.onload = () => {
      targetFrame.classList.add('active');
      currentFrame.classList.remove('active');
      activeFrame = activeFrame === 'A' ? 'B' : 'A';
      // 프리로드: 다음 url 백그라운드로
      const nextSc = SCENES[(i + 1) % SCENES.length];
      currentFrame.src = nextSc.url;
    };

    // 스텝 표식
    SCENES.forEach((_, k) => {
      const el = document.getElementById(`step-${k}`);
      el.classList.toggle('active', k === i);
      el.classList.toggle('done', k < i);
    });

    // 진행바
    const total = sc.ms;
    let elapsed = 0;
    clearInterval(progTimer);
    prog.style.width = '0%';
    progTimer = setInterval(() => {
      if (paused) return;
      elapsed += 100;
      prog.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    }, 100);

    clearTimeout(timer);
    if (!paused) timer = setTimeout(next, sc.ms);
  }

  function next() {
    idx = (idx + 1) % SCENES.length;
    render(idx);
  }
  function prev() {
    idx = (idx - 1 + SCENES.length) % SCENES.length;
    render(idx);
  }
  function togglePause() {
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? '▶ RESUME' : 'II PAUSE';
    if (!paused) render(idx);
    else clearTimeout(timer);
  }

  // 키 컨트롤
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === ' ') { e.preventDefault(); togglePause(); }
  });

  // Splash → 첫 시작
  setTimeout(() => {
    document.getElementById('splash').classList.add('fade');
    setTimeout(() => document.getElementById('splash').remove(), 700);
    render(0);
  }, 900);

  // 시계
  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }, 1000);
</script>

</body>
</html>
