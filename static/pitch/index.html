<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>AuraView — 2차 발표 (공공데이터 융합·차량 협력 인지 기반 도로 안전 AI 플랫폼)</title>
<meta name="description" content="2026 국토·교통 데이터 활용 경진대회 2차 발표 자료. 25 공공데이터 융합 + V2V 협업 인지 기반 한국 도로 안전 AI 블랙박스."/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reset.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css"/>
<style>
  :root { --bg:#05080F; }
  html, body, .reveal { background:var(--bg); }
  .reveal .slides section { padding:0; height:1080px; }
  .reveal .slides section img.slide { display:block; width:1920px; height:1080px; margin:0;
    object-fit:cover; }
  .reveal .controls { color:#00C8FF; }
  .reveal .progress { color:#00C8FF; height:4px; }
  .reveal .progress span { background:linear-gradient(90deg,#00C8FF,#00E09A); }
</style>
</head>
<body>
<div class="reveal">
<div class="slides">
  <section><img class="slide" src="img/slide_01.png" alt="표지"/></section>
  <section><img class="slide" src="img/slide_02.png" alt="문제 — 블랙박스는 사고 후에만"/></section>
  <section><img class="slide" src="img/slide_03.png" alt="해법 — 보조 혁신"/></section>
  <section><img class="slide" src="img/slide_04.png" alt="사각지대 데이터 엔진"/></section>
  <section><img class="slide" src="img/slide_05.png" alt="25 공공데이터 맥락화"/></section>
  <section><img class="slide" src="img/slide_06.png" alt="8 시나리오 법령·판례"/></section>
  <section><img class="slide" src="img/slide_07.png" alt="V2V 실시간 예방"/></section>
  <section><img class="slide" src="img/slide_08.png" alt="AI 모델"/></section>
  <section><img class="slide" src="img/slide_09.png" alt="4겹 해자 — 경쟁 차별화"/></section>
  <section><img class="slide" src="img/slide_10.png" alt="컴플라이언스 — DSZ"/></section>
  <section><img class="slide" src="img/slide_11.png" alt="데이터 플라이휠 + 3 고객 수익"/></section>
  <section><img class="slide" src="img/slide_12.png" alt="라이브 검증"/></section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
<script>
  Reveal.initialize({
    width: 1920, height: 1080, margin: 0, minScale: 0.2, maxScale: 2.0,
    controls: true, progress: true, hash: true,
    transition: 'slide', transitionSpeed: 'fast', keyboard: true, overview: true,
  });
</script>
</body>
</html>
