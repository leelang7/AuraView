<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720"
  font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1A1F2E" stroke-width="0.5"/>
    </pattern>
    <!-- Glow filters -->
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <!-- Camera noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Gradients -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1520"/>
      <stop offset="40%" stop-color="#1A2535"/>
      <stop offset="100%" stop-color="#0A1018"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1420"/>
      <stop offset="100%" stop-color="#060C14"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2A20"/>
      <stop offset="100%" stop-color="#091A12"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A070"/>
      <stop offset="100%" stop-color="#007A55"/>
    </linearGradient>
    <linearGradient id="hudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A0808"/>
      <stop offset="100%" stop-color="#1E0404"/>
    </linearGradient>
    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4040" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF4040" stop-opacity="0"/>
    </radialGradient>
    <!-- SMIL: HUD pulse animation -->
    <radialGradient id="hudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4040" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.4;0" dur="1.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF4040" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1200" height="720" fill="#0A0E18"/>
  <rect width="1200" height="720" fill="url(#grid)"/>

  <!-- Subtle vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1200" height="720" fill="url(#vignette)"/>

  <!-- ==================== TITLE ROW ==================== -->
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="900" fill="#E8EAF0">
    Flutter 네이티브 앱 —
    <tspan fill="#00E09A"> 운전자 폰에서 실시간 작동</tspan>
  </text>
  <text x="600" y="63" text-anchor="middle" font-size="13" fill="#888888">
    Android 7.0+ · iOS PWA · GitHub Releases APK 51MB · auraview.allthatai.kr/pwa/
  </text>

  <!-- ==================== LEFT PANEL: PHONE FRAME (v12.171: 가짜 박스 일괄 제거) ==================== -->
  <g transform="translate(40, 80)">
    <!-- Phone outer shell -->
    <rect x="30" y="0" width="330" height="620" rx="40" ry="40" fill="url(#phoneGrad)" filter="url(#shadow)"/>
    <rect x="30" y="0" width="330" height="620" rx="40" ry="40" fill="none" stroke="#333333" stroke-width="2"/>

    <!-- Side buttons -->
    <rect x="22" y="120" width="6" height="50" rx="3" fill="#222222"/>
    <rect x="22" y="185" width="6" height="35" rx="3" fill="#222222"/>
    <rect x="352" y="140" width="6" height="65" rx="3" fill="#222222"/>

    <!-- Status bar (notch + clock) -->
    <rect x="155" y="8" width="80" height="22" rx="11" fill="#0A0A0A"/>
    <text x="60" y="22" font-size="9" fill="#888888" font-weight="700">09:42</text>
    <text x="320" y="22" font-size="9" fill="#888888" font-weight="700" text-anchor="end">100%</text>

    <!-- Screen area (camera preview - dark, no fake objects) -->
    <rect x="40" y="40" width="310" height="500" rx="6" fill="#070A12"/>
    <!-- Subtle camera noise texture -->
    <rect x="40" y="40" width="310" height="500" rx="6" fill="url(#noise)" opacity="0.06"/>

    <!-- v12.171: Large AuraView 눈 로고 중앙 - 글로우 -->
    <g transform="translate(195, 240)">
      <!-- Outer glow halo -->
      <circle cx="0" cy="0" r="60" fill="url(#blueGlow)" opacity="0.7"/>
      <!-- Upper arc (vision/radar) -->
      <path d="M -28 0 Q 0 -22 28 0" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Lower arc (road/ground) -->
      <path d="M -28 0 Q 0 22 28 0" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Pupil dot -->
      <circle cx="0" cy="0" r="5.5" fill="#00C8FF"/>
      <circle cx="0" cy="0" r="9" fill="#00C8FF" opacity="0.35"/>
      <!-- Light highlight -->
      <circle cx="-1.5" cy="-1.5" r="1.8" fill="#FFFFFF" opacity="0.55"/>
    </g>

    <!-- Brand text below logo -->
    <text x="195" y="335" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AURAVIEW</text>
    <text x="195" y="352" font-size="8" font-weight="800" fill="#00C8FF" text-anchor="middle" letter-spacing="2">K-PERCEPTION  v12.171</text>

    <!-- Top status strip (brand + 연결 점 + 누적 카운터) -->
    <rect x="50" y="50" width="290" height="30" rx="15" fill="#0D1520" opacity="0.85"/>
    <circle cx="68" cy="65" r="3.5" fill="#00E09A"/>
    <text x="80" y="69" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="1">AURAVIEW</text>
    <text x="146" y="69" font-size="7" font-weight="700" fill="#00C8FF" letter-spacing="1">v12.171</text>
    <text x="330" y="69" font-size="8" font-weight="700" fill="#AAAAAA" text-anchor="end" font-family="monospace">8,420</text>

    <!-- v12.171: 누적 거리 (단순 chip, 가짜 객체 박스 없음) -->
    <g transform="translate(195, 405)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="rgba(0,0,0,0.45)" opacity="0.6"/>
      <text x="0" y="5" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">1,247 trip  ·  47.3 km</text>
    </g>

    <!-- Bottom single REC pill button (시연용 가짜 UI 제거 후 남은 유일한 컨트롤) -->
    <g transform="translate(195, 480)">
      <rect x="-65" y="-22" width="130" height="44" rx="22" fill="#00E09A" filter="url(#glow-green)"/>
      <circle cx="-38" cy="0" r="6" fill="#0D1520"/>
      <text x="-22" y="5" font-size="13" font-weight="900" fill="#0D1520" letter-spacing="2">주행 보기</text>
    </g>

  </g>

  <!-- ==================== CENTER PANEL: FLUTTER TECH STACK ==================== -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="300" height="620" rx="16" fill="url(#centerGrad)" stroke="#00E09A" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Top accent bar -->
    <rect x="0" y="0" width="300" height="4" rx="2" fill="#00E09A" opacity="0.7"/>

    <!-- Flutter logo area -->
    <text x="150" y="48" text-anchor="middle" font-size="34" font-weight="900" fill="#00E09A" filter="url(#glow-green)">Flutter 3.x</text>
    <text x="150" y="66" text-anchor="middle" font-size="10" fill="#00A070" letter-spacing="2">NATIVE FRAMEWORK</text>

    <!-- Divider -->
    <line x1="20" y1="78" x2="280" y2="78" stroke="#00E09A" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- Tech stack items -->
    <g font-size="12" fill="#CCCCCC">
      <!-- Item 1 -->
      <rect x="16" y="90" width="268" height="48" rx="8" fill="#0A1E14" stroke="#00E09A" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="30" y="110" font-size="18">📹</text>
      <text x="58" y="110" font-size="12" fill="#FFFFFF" font-weight="700">카메라 프리뷰 (CameraX)</text>
      <text x="58" y="127" font-size="10" fill="#669977">Flutter CameraController · 30fps 스트림</text>

      <!-- Item 2 -->
      <rect x="16" y="144" width="268" height="48" rx="8" fill="#0A1E14" stroke="#A095FF" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="30" y="164" font-size="18">🧠</text>
      <text x="58" y="164" font-size="12" fill="#FFFFFF" font-weight="700">ML Kit 객체 검출 (on-device)</text>
      <text x="58" y="181" font-size="10" fill="#8080CC">p99 1.04ms · 차량·보행자·자전거</text>

      <!-- Item 3 -->
      <rect x="16" y="198" width="268" height="48" rx="8" fill="#0A1E14" stroke="#00C8FF" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="30" y="218" font-size="18">📍</text>
      <text x="58" y="218" font-size="12" fill="#FFFFFF" font-weight="700">Geolocator GPS 추적</text>
      <text x="58" y="235" font-size="10" fill="#559999">1Hz 위치 업데이트 · Haversine 보정</text>

      <!-- Item 4 -->
      <rect x="16" y="252" width="268" height="48" rx="8" fill="#0A1E14" stroke="#00C8FF" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="30" y="272" font-size="18">🌐</text>
      <text x="58" y="272" font-size="12" fill="#FFFFFF" font-weight="700">HTTP /fleet/contribute</text>
      <text x="58" y="289" font-size="10" fill="#559999">PII 마스킹 후 업로드 · HMAC-SHA256</text>

      <!-- Item 5 -->
      <rect x="16" y="306" width="268" height="48" rx="8" fill="#0A1E14" stroke="#FFB020" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="30" y="326" font-size="18">📡</text>
      <text x="58" y="326" font-size="12" fill="#FFFFFF" font-weight="700">V2V broadcast</text>
      <text x="58" y="343" font-size="10" fill="#997744">/collab/v2v/broadcast · UDP multicast</text>

      <!-- Item 6 -->
      <rect x="16" y="360" width="268" height="48" rx="8" fill="#0A1E14" stroke="#00C8FF" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="30" y="380" font-size="18">🚌</text>
      <text x="58" y="380" font-size="12" fill="#FFFFFF" font-weight="700">BIS 라이브 폴링</text>
      <text x="58" y="397" font-size="10" fill="#449988">/collab/bus-live · 5s 간격 갱신</text>

      <!-- Item 7 -->
      <rect x="16" y="414" width="268" height="48" rx="8" fill="#0A1E14" stroke="#00E09A" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="30" y="434" font-size="18">🔄</text>
      <text x="58" y="434" font-size="12" fill="#FFFFFF" font-weight="700">/fusion/intersection 폴링</text>
      <text x="58" y="451" font-size="10" fill="#449966">15-source 융합 · 15s TTL 캐시</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="474" x2="280" y2="474" stroke="#00E09A" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- APK label -->
    <rect x="16" y="482" width="268" height="50" rx="8" fill="#050F0A"/>
    <text x="150" y="500" text-anchor="middle" font-size="11" fill="#888">배포 채널</text>
    <text x="60" y="518" font-size="11" fill="#00E09A" font-weight="700">📦 Native APK</text>
    <text x="175" y="518" font-size="11" fill="#AAAAAA">51MB · Android 7.0+</text>
    <text x="60" y="530" font-size="10" fill="#00C8FF">🌐 iOS Web PWA</text>
    <text x="175" y="530" font-size="10" fill="#AAAAAA">auraview.allthatai.kr</text>

    <!-- Flutter arch diagram mini -->
    <rect x="16" y="542" width="268" height="62" rx="8" fill="#050F0A"/>
    <text x="150" y="558" text-anchor="middle" font-size="9" fill="#556655">Flutter 레이어 아키텍처</text>
    <!-- Layer boxes -->
    <rect x="24" y="562" width="252" height="12" rx="3" fill="#0A2A18"/>
    <text x="150" y="572" text-anchor="middle" font-size="8" fill="#00E09A">UI Layer · AuraView Widgets</text>
    <rect x="24" y="576" width="252" height="12" rx="3" fill="#071A10"/>
    <text x="150" y="586" text-anchor="middle" font-size="8" fill="#669977">BLoC · Provider · State Mgmt</text>
    <rect x="24" y="590" width="252" height="12" rx="3" fill="#050F08"/>
    <text x="150" y="600" text-anchor="middle" font-size="8" fill="#445544">Platform Channels · FFI · Dart</text>
  </g>

  <!-- ==================== RIGHT PANEL: LIVE METRICS ==================== -->
  <g transform="translate(810, 80)">
    <rect x="0" y="0" width="360" height="620" rx="16" fill="#0A0F1A" stroke="#00C8FF" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="0" y="0" width="360" height="4" rx="2" fill="#00C8FF" opacity="0.5"/>

    <text x="180" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">실제 작동 메트릭</text>
    <text x="180" y="52" text-anchor="middle" font-size="10" fill="#556677">LIVE · 2026-05-17 09:42 KST</text>
    <!-- Live dot -->
    <circle cx="290" cy="34" r="5" fill="#FF4040">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="298" y="38" font-size="9" fill="#FF4040" font-weight="700">LIVE</text>

    <line x1="16" y1="60" x2="344" y2="60" stroke="#00C8FF" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- Metric Card 1: Active devices -->
    <rect x="16" y="70" width="328" height="86" rx="10" fill="#0A1828" stroke="#00E09A" stroke-width="1"/>
    <text x="32" y="96" font-size="22">📱</text>
    <text x="62" y="92" font-size="11" fill="#888888">활성 디바이스</text>
    <text x="62" y="118" font-size="28" fill="#00E09A" font-weight="900" filter="url(#glow-green)">1,247
      <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="180" y="118" font-size="14" fill="#00A070">대</text>
    <text x="240" y="118" font-size="10" fill="#445544">↑ +12 지난 1h</text>
    <!-- Mini sparkline -->
    <polyline points="240,130 255,125 265,128 278,120 292,122 308,116 322,110 338,108" fill="none" stroke="#00E09A" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Metric Card 2: Daily contributions -->
    <rect x="16" y="164" width="328" height="80" rx="10" fill="#0A1622" stroke="#00C8FF" stroke-width="1"/>
    <text x="32" y="188" font-size="22">📤</text>
    <text x="62" y="184" font-size="11" fill="#888888">일일 기여 건수</text>
    <text x="62" y="210" font-size="28" fill="#00C8FF" font-weight="900">8,420</text>
    <text x="182" y="210" font-size="14" fill="#0088AA">건</text>
    <text x="230" y="210" font-size="10" fill="#334455">누적 2.1M 이벤트</text>

    <!-- Metric Card 3: BIS polling -->
    <rect x="16" y="252" width="328" height="80" rx="10" fill="#141208" stroke="#FFB020" stroke-width="1"/>
    <text x="32" y="276" font-size="22">🚌</text>
    <text x="62" y="272" font-size="11" fill="#888888">BIS 실시간 폴링</text>
    <text x="62" y="298" font-size="14" fill="#FFB020" font-weight="700">/collab/bus-live</text>
    <rect x="218" y="284" width="48" height="20" rx="5" fill="#1A1000" stroke="#FFB020" stroke-width="1"/>
    <text x="242" y="298" text-anchor="middle" font-size="10" fill="#FFB020" font-weight="700">5s 폴링</text>
    <text x="62" y="314" font-size="10" fill="#665533">버스 노선 3,240개 · GPS 오차 &lt;3m</text>

    <!-- Metric Card 4: Inference latency -->
    <rect x="16" y="340" width="328" height="80" rx="10" fill="#0A0A14" stroke="#A095FF" stroke-width="1"/>
    <text x="32" y="364" font-size="22">⚡</text>
    <text x="62" y="360" font-size="11" fill="#888888">ML 추론 지연 (on-device)</text>
    <text x="62" y="386" font-size="28" fill="#A095FF" font-weight="900" filter="url(#glow-blue)">p99 1.04ms</text>
    <text x="62" y="402" font-size="10" fill="#554477">Snapdragon 865+ · TFLite INT8 quantized</text>

    <!-- Metric Card 5: PII masking -->
    <rect x="16" y="428" width="328" height="80" rx="10" fill="#0A0A16" stroke="#A095FF" stroke-width="1" stroke-opacity="0.6"/>
    <text x="32" y="452" font-size="22">🔒</text>
    <text x="62" y="448" font-size="11" fill="#888888">PII 마스킹 적용률</text>
    <text x="62" y="474" font-size="28" fill="#A095FF" font-weight="900">100%</text>
    <text x="168" y="468" font-size="10" fill="#A095FF">HMAC-SHA256</text>
    <text x="168" y="484" font-size="10" fill="#554477">얼굴·번호판 blur · 서버 비전송</text>
    <!-- Shield icon -->
    <text x="310" y="474" font-size="28" fill="#A095FF" opacity="0.4">🛡</text>

    <!-- GitHub releases link -->
    <rect x="16" y="520" width="328" height="46" rx="8" fill="#080C14" stroke="#334455" stroke-width="1"/>
    <text x="32" y="538" font-size="10" fill="#666666">APK 다운로드</text>
    <text x="32" y="554" font-size="10" fill="#4488CC">github.com/leelang7/AuraView/releases</text>
    <text x="290" y="548" font-size="18">↗</text>

    <!-- QR placeholder -->
    <rect x="250" y="572" width="100" height="42" rx="6" fill="#0A0F18" stroke="#334455" stroke-width="1"/>
    <text x="300" y="588" text-anchor="middle" font-size="8" fill="#445566">[ QR ]</text>
    <text x="300" y="600" text-anchor="middle" font-size="7" fill="#334455">auraview.allthatai.kr</text>
    <text x="300" y="610" text-anchor="middle" font-size="7" fill="#334455">/pwa/</text>

    <!-- Version badge -->
    <rect x="16" y="576" width="140" height="38" rx="6" fill="#080C14" stroke="#00E09A" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="26" y="591" font-size="9" fill="#668866">릴리즈 v2.4.1 · 2026-05-15</text>
    <text x="26" y="606" font-size="9" fill="#00E09A">APK + PWA + Native ✓</text>
  </g>

  <!-- ==================== BOTTOM COPY ==================== -->
  <rect x="0" y="696" width="1200" height="24" fill="#050A10"/>
  <line x1="0" y1="696" x2="1200" y2="696" stroke="#00E09A" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="600" y="712" text-anchor="middle" font-size="12" fill="#558866" font-weight="600">
    실제 앱은 라이브 — github.com/leelang7/AuraView   APK + PWA + Native
  </text>
  <text x="50" y="712" font-size="10" fill="#334455">AuraView · AuraView K-Perception</text>
  <text x="1150" y="712" text-anchor="end" font-size="10" fill="#334455">K-PERCEPTION © 2026</text>

  <!-- Corner decorations -->
  <rect x="0" y="0" width="3" height="60" fill="#00E09A" opacity="0.5"/>
  <rect x="0" y="0" width="60" height="3" fill="#00E09A" opacity="0.5"/>
  <rect x="1197" y="0" width="3" height="60" fill="#00C8FF" opacity="0.5"/>
  <rect x="1140" y="0" width="60" height="3" fill="#00C8FF" opacity="0.5"/>
  <rect x="0" y="717" width="3" height="3" fill="#00E09A" opacity="0.5"/>
  <rect x="1197" y="717" width="3" height="3" fill="#00C8FF" opacity="0.5"/>
</svg>
