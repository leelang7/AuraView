<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" version="1.1">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E18;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0F1525;stop-opacity:1"/>
    </linearGradient>

    <!-- Accent glow for logo dot -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00E09A;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#00E09A;stop-opacity:0"/>
    </radialGradient>

    <!-- Subtle center glow -->
    <radialGradient id="centerGlow" cx="40%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#00E09A;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#0A0E18;stop-opacity:0"/>
    </radialGradient>

    <!-- Right panel overlay -->
    <linearGradient id="rightPanel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A0E18;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#111827;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#111827;stop-opacity:0.8"/>
    </linearGradient>

    <!-- Stat card gradients -->
    <linearGradient id="statGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E09A;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00E09A;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="statBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00C8FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00C8FF;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="statOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB020;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFB020;stop-opacity:0.04"/>
    </linearGradient>

    <!-- Clip for right decorative area -->
    <clipPath id="rightClip">
      <rect x="820" y="0" width="380" height="630"/>
    </clipPath>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1E2A40" stroke-width="0.6" opacity="0.5">
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Center glow overlay -->
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- Top separator line -->
  <line x1="44" y1="64" x2="1156" y2="64" stroke="#1E2A40" stroke-width="1"/>

  <!-- Bottom separator line -->
  <line x1="44" y1="510" x2="1156" y2="510" stroke="#1E2A40" stroke-width="1"/>

  <!-- === TOP LEFT: LOGO === -->
  <!-- Logo glow halo -->
  <circle cx="54" cy="36" r="18" fill="url(#dotGlow)" opacity="0.6"/>
  <!-- Logo dot -->
  <circle cx="54" cy="36" r="7" fill="#00E09A"/>
  <!-- Inner highlight -->
  <circle cx="51" cy="33" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Brand name -->
  <text x="70" y="44" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="0.5">AuraView</text>

  <!-- === TOP RIGHT: CONTEST LABEL === -->
  <text x="1156" y="38"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="12" fill="#8896B0" letter-spacing="2" text-anchor="end">
    AuraView K-Perception 출품작
  </text>

  <!-- === MAIN COPY (center-left) === -->
  <!-- Line 1 -->
  <text x="60" y="250"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-weight="900" font-size="60" fill="#FFFFFF">
    운전자가 못 보는 곳을
  </text>
  <!-- Line 2: "AuraView가 본다" with AuraView in accent color -->
  <text x="60" y="330"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-weight="900" font-size="60" fill="#FFFFFF">
    <tspan fill="#00E09A">AuraView</tspan>가 본다
  </text>

  <!-- Underline accent beneath main copy -->
  <rect x="60" y="345" width="120" height="4" rx="2" fill="#00E09A" opacity="0.8"/>

  <!-- === SUBTITLE === -->
  <text x="60" y="395"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="22" fill="#8896B0">
    24종 공공데이터 + V2V 협업 인지로 평균 3.38초 먼저 위험 감지
  </text>

  <!-- === STAT CARDS (bottom-left, 3 cards) === -->
  <!-- Card 1: 3.38초 선행 경고 (Green) -->
  <rect x="60" y="530" width="220" height="72" rx="10" fill="url(#statGreen)" stroke="#00E09A" stroke-width="1" stroke-opacity="0.4"/>
  <text x="80" y="563"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-weight="900" font-size="28" fill="#00E09A">3.38초</text>
  <text x="80" y="589"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="14" fill="#8896B0">선행 경고</text>

  <!-- Card 2: 84.5% 회피 성공 (Blue) -->
  <rect x="300" y="530" width="220" height="72" rx="10" fill="url(#statBlue)" stroke="#00C8FF" stroke-width="1" stroke-opacity="0.4"/>
  <text x="320" y="563"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-weight="900" font-size="28" fill="#00C8FF">84.5%</text>
  <text x="320" y="589"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="14" fill="#8896B0">회피 성공</text>

  <!-- Card 3: 매년 21명 보호 (Orange) -->
  <rect x="540" y="530" width="220" height="72" rx="10" fill="url(#statOrange)" stroke="#FFB020" stroke-width="1" stroke-opacity="0.4"/>
  <text x="560" y="563"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-weight="900" font-size="28" fill="#FFB020">21명</text>
  <text x="560" y="589"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="14" fill="#8896B0">매년 보호</text>

  <!-- === RIGHT DECORATIVE AREA === -->
  <!-- Right panel subtle background -->
  <rect x="820" y="0" width="380" height="630" fill="url(#rightPanel)"/>

  <!-- Road surface (bottom of right panel) -->
  <g clip-path="url(#rightClip)" opacity="0.45">
    <!-- Road base -->
    <rect x="820" y="400" width="380" height="230" rx="0" fill="#111827"/>
    <!-- Road center line (dashed) -->
    <rect x="996" y="410" width="8" height="30" rx="2" fill="#8896B0" opacity="0.5"/>
    <rect x="996" y="450" width="8" height="30" rx="2" fill="#8896B0" opacity="0.5"/>
    <rect x="996" y="490" width="8" height="30" rx="2" fill="#8896B0" opacity="0.5"/>
    <rect x="996" y="530" width="8" height="30" rx="2" fill="#8896B0" opacity="0.5"/>
    <rect x="996" y="570" width="8" height="30" rx="2" fill="#8896B0" opacity="0.5"/>

    <!-- Crosswalk stripes -->
    <rect x="840" y="530" width="140" height="12" rx="1" fill="#FFFFFF" opacity="0.18"/>
    <rect x="840" y="550" width="140" height="12" rx="1" fill="#FFFFFF" opacity="0.18"/>
    <rect x="840" y="570" width="140" height="12" rx="1" fill="#FFFFFF" opacity="0.18"/>
    <rect x="840" y="590" width="140" height="12" rx="1" fill="#FFFFFF" opacity="0.18"/>
    <rect x="840" y="610" width="140" height="12" rx="1" fill="#FFFFFF" opacity="0.18"/>

    <!-- Traffic light pole -->
    <rect x="1090" y="300" width="6" height="140" fill="#374151"/>
    <!-- Traffic light housing -->
    <rect x="1070" y="240" width="46" height="90" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
    <!-- Red light -->
    <circle cx="1093" cy="260" r="12" fill="#FF3B3B" opacity="0.9"/>
    <circle cx="1093" cy="260" r="8" fill="#FF6B6B" opacity="0.4"/>
    <!-- Yellow light -->
    <circle cx="1093" cy="285" r="12" fill="#FFB020" opacity="0.5"/>
    <!-- Green light -->
    <circle cx="1093" cy="310" r="12" fill="#00E09A" opacity="0.9"/>
    <circle cx="1093" cy="310" r="8" fill="#4FFFCB" opacity="0.4"/>

    <!-- Pedestrian silhouette (simple) -->
    <!-- Head -->
    <circle cx="900" cy="512" r="9" fill="#8896B0" opacity="0.7"/>
    <!-- Body -->
    <rect x="895" y="522" width="10" height="20" rx="3" fill="#8896B0" opacity="0.7"/>
    <!-- Left leg -->
    <line x1="897" y1="542" x2="892" y2="562" stroke="#8896B0" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- Right leg -->
    <line x1="903" y1="542" x2="908" y2="562" stroke="#8896B0" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- Left arm -->
    <line x1="895" y1="526" x2="884" y2="538" stroke="#8896B0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- Right arm -->
    <line x1="905" y1="526" x2="916" y2="538" stroke="#8896B0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Detection circle around pedestrian (AuraView detection halo) -->
    <circle cx="900" cy="535" r="38" fill="none" stroke="#00E09A" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
    <circle cx="900" cy="535" r="48" fill="none" stroke="#00E09A" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.35"/>

    <!-- Warning indicator -->
    <!-- Triangle warning above pedestrian -->
    <polygon points="900,468 917,498 883,498" fill="none" stroke="#FFB020" stroke-width="2" opacity="0.8"/>
    <text x="900" y="494" text-anchor="middle" font-size="16" fill="#FFB020" font-weight="900" opacity="0.9">!</text>

    <!-- Data lines (connecting to right side) -->
    <line x1="948" y1="535" x2="1060" y2="490" stroke="#00E09A" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="948" y1="520" x2="1060" y2="470" stroke="#00C8FF" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.3"/>
  </g>

  <!-- Vertical separator line between content and decoration -->
  <line x1="820" y1="80" x2="820" y2="550" stroke="#1E2A40" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- === WATERMARK === -->
  <text x="1156" y="617"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="14" fill="#555555" text-anchor="end" letter-spacing="0.5">
    auraview.allthatai.kr
  </text>

  <!-- === BORDER === -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#1E2A40" stroke-width="2" rx="0"/>
</svg>
