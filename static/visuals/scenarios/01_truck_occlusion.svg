<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 배경 -->
  <rect width="600" height="400" fill="#0F1525"/>
  <!-- 미세 격자 -->
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#1E2A45" stroke-width="0.5"/>
    </pattern>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#grid1)"/>

  <!-- 좌상단 배지 -->
  <circle cx="48" cy="48" r="32" fill="#FF4444"/>
  <text x="48" y="44" text-anchor="middle" font-size="11" fill="white" font-weight="700">시나리오</text>
  <text x="48" y="62" text-anchor="middle" font-size="20" fill="white" font-weight="900">01</text>

  <!-- 상단 제목 -->
  <text x="300" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="white">트럭 가림 시나리오</text>
  <text x="300" y="60" text-anchor="middle" font-size="13" fill="#AABBCC">Truck Occlusion — 전방 시야 차단</text>

  <!-- 우상단 위험도 -->
  <text x="560" y="30" text-anchor="middle" font-size="18" fill="#FF4444">⚠</text>
  <text x="560" y="48" text-anchor="middle" font-size="11" fill="#FF8888">위험도</text>
  <text x="560" y="62" text-anchor="middle" font-size="12" fill="#FF4444" font-weight="700">높음</text>

  <!-- 도로 -->
  <rect x="80" y="200" width="440" height="120" rx="4" fill="#1C2340"/>
  <!-- 차선 -->
  <rect x="80" y="255" width="440" height="4" fill="#2A3A5A"/>
  <rect x="130" y="250" width="40" height="6" rx="2" fill="#FFD93D" opacity="0.7"/>
  <rect x="210" y="250" width="40" height="6" rx="2" fill="#FFD93D" opacity="0.7"/>
  <rect x="290" y="250" width="40" height="6" rx="2" fill="#FFD93D" opacity="0.7"/>
  <rect x="370" y="250" width="40" height="6" rx="2" fill="#FFD93D" opacity="0.7"/>

  <!-- 횡단보도 (한국 표준: 차량 진행방향과 평행한 가로 stripe 가 세로로 반복) -->
  <rect x="370" y="204" width="80" height="11" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="220" width="80" height="11" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="236" width="80" height="11" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="252" width="80" height="11" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="268" width="80" height="11" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="284" width="80" height="11" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="300" width="80" height="11" fill="#E8E8E8" opacity="0.92"/>

  <!-- 대형 트럭 -->
  <rect x="150" y="200" width="160" height="80" rx="6" fill="#3A4A70"/>
  <rect x="150" y="195" width="160" height="12" rx="3" fill="#FF4444" opacity="0.8"/>
  <rect x="155" y="210" width="70" height="50" rx="3" fill="#2A3760"/>
  <rect x="235" y="210" width="70" height="50" rx="3" fill="#2A3760"/>
  <circle cx="175" cy="285" r="12" fill="#111" stroke="#555" stroke-width="2"/>
  <circle cx="175" cy="285" r="5" fill="#333"/>
  <circle cx="290" cy="285" r="12" fill="#111" stroke="#555" stroke-width="2"/>
  <circle cx="290" cy="285" r="5" fill="#333"/>
  <!-- 트럭 표시 -->
  <text x="228" y="248" text-anchor="middle" font-size="11" fill="#8899BB">TRUCK</text>

  <!-- 트럭 뒤 숨겨진 사람 (보이지 않음 표현) -->
  <g opacity="0.45">
    <circle cx="430" cy="218" r="10" fill="#FF8888"/>
    <rect x="425" y="228" width="10" height="20" rx="3" fill="#FF8888"/>
    <line x1="425" y1="235" x2="418" y2="248" stroke="#FF8888" stroke-width="2"/>
    <line x1="435" y1="235" x2="442" y2="248" stroke="#FF8888" stroke-width="2"/>
  </g>
  <!-- 가림 효과 -->
  <rect x="310" y="190" width="100" height="135" fill="#0F1525" opacity="0.6"/>
  <text x="355" y="268" text-anchor="middle" font-size="10" fill="#FF4444">?</text>

  <!-- AuraView 시야 화살표 -->
  <path d="M 320 160 Q 370 140 420 220" stroke="#FF4444" stroke-width="1.5" fill="none" stroke-dasharray="5,4" opacity="0.8"/>
  <polygon points="415,220 425,212 428,225" fill="#FF4444" opacity="0.8"/>
  <text x="360" y="130" text-anchor="middle" font-size="10" fill="#FF6666">V2V 공유 시점</text>

  <!-- 맞은편 AuraView 차 -->
  <rect x="440" y="260" width="60" height="32" rx="4" fill="#00E09A" opacity="0.7"/>
  <text x="470" y="281" text-anchor="middle" font-size="9" fill="#003" font-weight="700">AV</text>

  <!-- 펄스 애니메이션 -->
  <circle cx="430" cy="228" r="15" fill="none" stroke="#FF4444" stroke-width="2" opacity="0">
    <animate attributeName="r" values="15;35;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 하단 카피 -->
  <rect x="0" y="355" width="600" height="45" fill="#0A0F1E" opacity="0.9"/>
  <text x="180" y="381" text-anchor="middle" font-size="14" fill="#00E09A" font-weight="600">AuraView 가 V2V로 마주오는 차의 시점을 빌려 위험을 감지합니다</text>

  <!-- 우하단 데이터 라벨 -->
  <rect x="460" y="358" width="132" height="32" rx="6" fill="#1E2A45"/>
  <text x="526" y="370" text-anchor="middle" font-size="9" fill="#7799BB">핵심 데이터</text>
  <text x="526" y="383" text-anchor="middle" font-size="11" fill="#00E09A" font-weight="700">V2V + TAAS</text>
</svg>
