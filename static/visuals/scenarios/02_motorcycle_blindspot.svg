<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 배경 -->
  <rect width="600" height="400" fill="#0F1525"/>
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#1E2A45" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid2)"/>

  <!-- 좌상단 배지 -->
  <circle cx="48" cy="48" r="32" fill="#FFB020"/>
  <text x="48" y="44" text-anchor="middle" font-size="11" fill="white" font-weight="700">시나리오</text>
  <text x="48" y="62" text-anchor="middle" font-size="20" fill="white" font-weight="900">02</text>

  <!-- 상단 제목 -->
  <text x="300" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="white">좌측 사각 이륜차</text>
  <text x="300" y="60" text-anchor="middle" font-size="13" fill="#AABBCC">Motorcycle Blind Spot — BEV 점유 추정</text>

  <!-- 우상단 위험도 -->
  <text x="560" y="30" text-anchor="middle" font-size="18" fill="#FFB020">⚠</text>
  <text x="560" y="48" text-anchor="middle" font-size="11" fill="#FFCC88">위험도</text>
  <text x="560" y="62" text-anchor="middle" font-size="12" fill="#FFB020" font-weight="700">높음</text>

  <!-- 도로 (탑뷰, 2차로 · 한국 우측통행) -->
  <rect x="80" y="130" width="440" height="200" rx="4" fill="#1C2340"/>
  <!-- 차로 배경 음영 (위=반대편, 아래=내 차 진행방향) -->
  <rect x="80" y="135" width="440" height="93" fill="#162038" opacity="0.55"/>
  <rect x="80" y="232" width="440" height="93" fill="#0F2335" opacity="0.30"/>
  <!-- 중앙선 (노란 dashed) -->
  <rect x="120" y="228" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="200" y="228" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="280" y="228" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="360" y="228" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="440" y="228" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <line x1="80" y1="135" x2="520" y2="135" stroke="#3A4A6A" stroke-width="1.2"/>
  <line x1="80" y1="325" x2="520" y2="325" stroke="#3A4A6A" stroke-width="1.2"/>
  <!-- ★ 진행 방향 라벨 (양방향 명시) -->
  <text x="100" y="175" font-size="14" font-weight="900" fill="#5A6C8C" opacity="0.85">⟵  반대 차로</text>
  <text x="100" y="280" font-size="14" font-weight="900" fill="#7CC8FF" opacity="0.95">내 차 ⟶</text>

  <!-- 주 차량 (내 차) — 우측통행 → 아래 차로(y=232~325) 안 -->
  <rect x="290" y="252" width="78" height="48" rx="6" fill="#3A6FD8"/>
  <text x="329" y="282" text-anchor="middle" font-size="10" fill="white" font-weight="800" letter-spacing="0.5">내 차</text>
  <!-- 차량 방향 화살표 (진행 방향: 우측) -->
  <polygon points="375,276 388,276 388,272 396,278 388,284 388,280 375,280" fill="#7CC8FF" opacity="0.85"/>

  <!-- 사각지대 扇형 (내 차 좌측 후방 = 탑뷰 좌측 아래) -->
  <path d="M 290 252 L 160 305 L 160 325 L 290 300 Z" fill="#FFB020" opacity="0.18"/>
  <text x="220" y="320" text-anchor="middle" font-size="11" fill="#FFB020" font-weight="700">좌측 후방 사각</text>

  <!-- 이륜차 (사각지대 안, 같은 차로) -->
  <g>
    <circle cx="195" cy="298" r="7" fill="none" stroke="#FFB020" stroke-width="2"/>
    <circle cx="215" cy="298" r="7" fill="none" stroke="#FFB020" stroke-width="2"/>
    <rect x="192" y="294" width="26" height="8" rx="2" fill="#FFB020" opacity="0.9"/>
    <circle cx="205" cy="289" r="5" fill="#FFD093"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- 펄스 링 (이륜차 강조) -->
  <circle cx="205" cy="298" r="18" fill="none" stroke="#FFB020" stroke-width="2" opacity="0">
    <animate attributeName="r" values="18;40;18" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- BEV 점유 그리드 패널 (좌상단, 라벨과 분리) -->
  <rect x="98" y="148" width="120" height="58" rx="6" fill="#0D1428" stroke="#FFB020" stroke-width="1.2" opacity="0.85"/>
  <text x="158" y="166" text-anchor="middle" font-size="10" fill="#FFB020" font-weight="700">BEV occupancy</text>
  <g opacity="0.85" transform="translate(108, 174)">
    <rect x="0"  y="0"  width="22" height="22" fill="#FFB020" opacity="0.30" rx="2"/>
    <rect x="24" y="0"  width="22" height="22" fill="#FFB020" opacity="0.55" rx="2"/>
    <rect x="48" y="0"  width="22" height="22" fill="#FFB020" opacity="0.75" rx="2"/>
    <rect x="72" y="0"  width="22" height="22" fill="#FFB020" opacity="0.95" rx="2"/>
  </g>

  <!-- HydraNet 패널 (우상단) -->
  <rect x="406" y="148" width="104" height="50" rx="6" fill="#0D1428" stroke="#7799BB" stroke-width="1" opacity="0.85"/>
  <text x="458" y="165" text-anchor="middle" font-size="10" fill="#7799BB" font-weight="700">HydraNet</text>
  <text x="458" y="183" text-anchor="middle" font-size="10" fill="#FFB020" font-weight="600">점유 추정중</text>

  <!-- 하단 카피 (좌측, 우측 데이터 라벨과 분리) -->
  <rect x="0" y="355" width="430" height="45" fill="#0A0F1E" opacity="0.9"/>
  <text x="215" y="383" text-anchor="middle" font-size="13" fill="#00E09A" font-weight="700">AuraView 가 BEV 로 사각지대 점유를 추정합니다</text>

  <!-- 우하단 데이터 라벨 (분리) -->
  <rect x="438" y="355" width="162" height="45" fill="#1E2A45" opacity="0.9"/>
  <text x="519" y="370" text-anchor="middle" font-size="9" fill="#7799BB">핵심 데이터</text>
  <text x="519" y="389" text-anchor="middle" font-size="12" fill="#FFB020" font-weight="800">HydraNet + ITS</text>
</svg>
