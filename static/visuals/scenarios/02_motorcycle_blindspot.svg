<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 배경 -->
  <rect width="600" height="400" fill="#0F1525"/>
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#1E2A45" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid2)"/>

  <!-- 좌상단 배지 -->
  <circle cx="48" cy="48" r="32" fill="#FFB020"/>
  <text x="48" y="44" text-anchor="middle" font-size="11" fill="white" font-weight="700">시나리오</text>
  <text x="48" y="62" text-anchor="middle" font-size="20" fill="white" font-weight="900">02</text>

  <!-- 상단 제목 -->
  <text x="300" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="white">좌측 사각 이륜차</text>
  <text x="300" y="60" text-anchor="middle" font-size="13" fill="#AABBCC">Motorcycle Blind Spot — BEV 점유 추정</text>

  <!-- 우상단 위험도 -->
  <text x="560" y="30" text-anchor="middle" font-size="18" fill="#FFB020">⚠</text>
  <text x="560" y="48" text-anchor="middle" font-size="11" fill="#FFCC88">위험도</text>
  <text x="560" y="62" text-anchor="middle" font-size="12" fill="#FFB020" font-weight="700">높음</text>

  <!-- 도로 (탑뷰) -->
  <rect x="80" y="130" width="440" height="200" rx="4" fill="#1C2340"/>
  <!-- 차선 -->
  <rect x="80" y="225" width="440" height="4" fill="#2A3A5A"/>
  <rect x="80" y="190" width="440" height="4" fill="#2A3A5A"/>
  <rect x="120" y="225" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.6"/>
  <rect x="200" y="225" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.6"/>
  <rect x="280" y="225" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.6"/>
  <rect x="360" y="225" width="30" height="4" rx="1" fill="#FFD93D" opacity="0.6"/>

  <!-- 주 차량 (탑뷰) -->
  <rect x="240" y="205" width="80" height="50" rx="6" fill="#3A6FD8"/>
  <text x="280" y="235" text-anchor="middle" font-size="10" fill="white" font-weight="700">EGO</text>

  <!-- 사각지대 扇형 -->
  <path d="M 240 205 L 120 140 L 120 210 Z" fill="#FFB020" opacity="0.18"/>
  <path d="M 240 205 L 120 210 L 120 260 Z" fill="#FFB020" opacity="0.12"/>
  <text x="175" y="200" text-anchor="middle" font-size="11" fill="#FFB020" opacity="0.9">사각지대</text>

  <!-- 이륜차 -->
  <g>
    <circle cx="165" cy="222" r="8" fill="none" stroke="#FFB020" stroke-width="2"/>
    <circle cx="185" cy="222" r="8" fill="none" stroke="#FFB020" stroke-width="2"/>
    <rect x="162" y="218" width="28" height="8" rx="2" fill="#FFB020" opacity="0.8"/>
    <circle cx="175" cy="213" r="5" fill="#FFD093"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </g>
  <!-- 이륜차 라벨 -->
  <text x="175" y="248" text-anchor="middle" font-size="9" fill="#FFB020">이륜차</text>

  <!-- BEV 점유 그리드 -->
  <g opacity="0.7">
    <rect x="130" y="195" width="20" height="20" fill="#FFB020" opacity="0.3" rx="1"/>
    <rect x="150" y="195" width="20" height="20" fill="#FFB020" opacity="0.5" rx="1"/>
    <rect x="130" y="215" width="20" height="20" fill="#FFB020" opacity="0.6" rx="1"/>
    <rect x="150" y="215" width="20" height="20" fill="#FFB020" opacity="0.8" rx="1"/>
  </g>
  <text x="152" y="192" text-anchor="middle" font-size="9" fill="#FFB020">BEV occupancy</text>

  <!-- HydraNet 아이콘 -->
  <rect x="430" y="150" width="80" height="30" rx="5" fill="#1E2A45"/>
  <text x="470" y="161" text-anchor="middle" font-size="9" fill="#7799BB">HydraNet</text>
  <text x="470" y="174" text-anchor="middle" font-size="10" fill="#FFB020" font-weight="600">점유 추정중</text>

  <!-- 펄스 링 애니메이션 -->
  <circle cx="175" cy="222" r="20" fill="none" stroke="#FFB020" stroke-width="2" opacity="0">
    <animate attributeName="r" values="20;45;20" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 하단 카피 -->
  <rect x="0" y="355" width="600" height="45" fill="#0A0F1E" opacity="0.9"/>
  <text x="190" y="381" text-anchor="middle" font-size="14" fill="#00E09A" font-weight="600">AuraView 가 BEV occupancy 로 사각지대 점유를 추정합니다</text>

  <!-- 우하단 데이터 라벨 -->
  <rect x="458" y="358" width="134" height="32" rx="6" fill="#1E2A45"/>
  <text x="525" y="370" text-anchor="middle" font-size="9" fill="#7799BB">핵심 데이터</text>
  <text x="525" y="383" text-anchor="middle" font-size="11" fill="#FFB020" font-weight="700">HydraNet + ITS</text>
</svg>
