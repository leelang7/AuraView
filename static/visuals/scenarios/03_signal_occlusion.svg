<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 배경 -->
  <rect width="600" height="400" fill="#0F1525"/>
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#1E2A45" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid3)"/>

  <!-- 좌상단 배지 -->
  <circle cx="48" cy="48" r="32" fill="#FFD93D"/>
  <text x="48" y="44" text-anchor="middle" font-size="11" fill="#1A1A00" font-weight="700">시나리오</text>
  <text x="48" y="62" text-anchor="middle" font-size="20" fill="#1A1A00" font-weight="900">03</text>

  <!-- 상단 제목 -->
  <text x="300" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="white">신호등 가림 시나리오</text>
  <text x="300" y="60" text-anchor="middle" font-size="13" fill="#AABBCC">Signal Occlusion — 버스에 의한 신호 차단</text>

  <!-- 우상단 위험도 -->
  <text x="560" y="30" text-anchor="middle" font-size="18" fill="#FFD93D">⚠</text>
  <text x="560" y="48" text-anchor="middle" font-size="11" fill="#FFEE88">위험도</text>
  <text x="560" y="62" text-anchor="middle" font-size="12" fill="#FFD93D" font-weight="700">중간</text>

  <!-- 도로 (탑뷰, 2차로 · 한국 우측통행) -->
  <rect x="80" y="200" width="440" height="120" rx="4" fill="#1C2340"/>
  <rect x="80" y="205" width="440" height="55" fill="#162038" opacity="0.55"/>
  <rect x="80" y="262" width="440" height="55" fill="#0F2335" opacity="0.30"/>
  <rect x="120" y="258" width="32" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="200" y="258" width="32" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="280" y="258" width="32" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="500" y="258" width="14" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <line x1="80" y1="205" x2="520" y2="205" stroke="#3A4A6A" stroke-width="1.2"/>
  <line x1="80" y1="315" x2="520" y2="315" stroke="#3A4A6A" stroke-width="1.2"/>
  <!-- ★ 진행 방향 라벨 -->
  <text x="88" y="228" font-size="12" font-weight="900" fill="#5A6C8C" opacity="0.85">⟵  반대 차로</text>
  <text x="88" y="304" font-size="12" font-weight="900" fill="#7CC8FF" opacity="0.95">내 차 ⟶</text>

  <!-- 한국 표준 차량 신호등 (도로 우측 가장자리 cantilever 기둥 + 가로 빔 → 도로 위 박스) -->
  <!-- 세로 기둥 (도로 끝 우측 = 교차로 끝, 인도 위) -->
  <rect x="510" y="180" width="6" height="125" fill="#3A4A6A"/>
  <!-- 기둥 받침 (인도) -->
  <rect x="503" y="303" width="20" height="8" rx="1.5" fill="#2A3A5A"/>
  <!-- 가로 cantilever 빔 (위쪽에서 도로 안쪽으로 뻗음) -->
  <rect x="370" y="178" width="146" height="5" fill="#3A4A6A"/>
  <!-- 신호등 박스 (도로 위 공중) -->
  <rect x="372" y="138" width="92" height="40" rx="4" fill="#1A1A1A" stroke="#444" stroke-width="1.5"/>
  <!-- 흰 테두리 헤드 (차양) -->
  <rect x="372" y="138" width="92" height="6" fill="#2A2A2A"/>
  <!-- 신호등 라이트: 적-황-녹 가로 배열 (한국 표준) -->
  <circle cx="392" cy="158" r="9" fill="#220A0A"/>
  <circle cx="392" cy="158" r="6.5" fill="#333"/>
  <circle cx="418" cy="158" r="9" fill="#1A1A06"/>
  <circle cx="418" cy="158" r="6.5" fill="#333"/>
  <circle cx="444" cy="158" r="9" fill="#0A1A12"/>
  <circle cx="444" cy="158" r="6.5" fill="#00CC44" opacity="0.95">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 좌회전 표시 (선택) -->
  <text x="418" y="135" text-anchor="middle" font-size="8" fill="#7799BB">차량 신호</text>

  <!-- 대형 버스 (아래 차로 안, 내 차 앞쪽 — 신호등 가림) — 우측통행 적용 우측 배치 -->
  <rect x="380" y="266" width="115" height="46" rx="5" fill="#2E4A80"/>
  <rect x="388" y="272" width="36" height="20" rx="2" fill="#1A2840" opacity="0.85"/>
  <rect x="430" y="272" width="32" height="20" rx="2" fill="#1A2840" opacity="0.85"/>
  <rect x="468" y="272" width="22" height="20" rx="2" fill="#1A2840" opacity="0.85"/>
  <circle cx="397" cy="312" r="6" fill="#111" stroke="#555" stroke-width="1.5"/>
  <circle cx="478" cy="312" r="6" fill="#111" stroke="#555" stroke-width="1.5"/>
  <text x="437" y="293" text-anchor="middle" font-size="10" fill="#9AB5DD" font-weight="700">버스</text>

  <!-- 신호등 가림 표시 (버스가 신호등 박스 가림) -->
  <path d="M 372 144 L 464 144 L 464 178 L 372 178 Z" fill="none" stroke="#FFD93D" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.85"/>
  <text x="418" y="170" text-anchor="middle" font-size="10" fill="#FFD93D" font-weight="700">가림 구역</text>

  <!-- API 직접 호출 표시 -->
  <rect x="100" y="130" width="130" height="55" rx="8" fill="#1A2840" stroke="#FFD93D" stroke-width="1.5"/>
  <text x="165" y="150" text-anchor="middle" font-size="10" fill="#FFD93D" font-weight="700">신호 API 직접 호출</text>
  <text x="165" y="165" text-anchor="middle" font-size="9" fill="#99AACC">현재: 녹색 (14s)</text>
  <text x="165" y="178" text-anchor="middle" font-size="9" fill="#99AACC">Camera fallback OK</text>

  <!-- 연결선 (API → 신호등 박스) -->
  <line x1="230" y1="157" x2="372" y2="158" stroke="#FFD93D" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- 내 차 (아래 차로, 화면 우측 — 한국 우측통행 + 버스 뒤) -->
  <rect x="290" y="269" width="74" height="42" rx="5" fill="#3A6FD8"/>
  <text x="327" y="295" text-anchor="middle" font-size="10" fill="white" font-weight="800">내 차</text>
  <!-- 진행 방향 화살표 -->
  <polygon points="368,287 380,287 380,283 388,290 380,296 380,292 368,292" fill="#7CC8FF" opacity="0.85"/>

  <!-- 신호 복구 애니메이션 (녹색 위치 cx=440 맞춤) -->
  <circle cx="440" cy="122" r="8" fill="#00CC44" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 하단 카피 (좌측) + 데이터 라벨 (우측) — 명확히 분리 -->
  <rect x="0" y="355" width="420" height="45" fill="#0A0F1E" opacity="0.9"/>
  <text x="210" y="383" text-anchor="middle" font-size="13" fill="#00E09A" font-weight="700">신호 API 직접 호출로 카메라 가림 극복</text>

  <rect x="428" y="355" width="172" height="45" fill="#1E2A45" opacity="0.9"/>
  <text x="514" y="370" text-anchor="middle" font-size="9" fill="#7799BB">핵심 데이터</text>
  <text x="514" y="389" text-anchor="middle" font-size="12" fill="#FFD93D" font-weight="800">신호 API + 버스 prior</text>
</svg>
