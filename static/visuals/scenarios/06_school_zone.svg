<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 배경 -->
  <rect width="600" height="400" fill="#0F1525"/>
  <defs>
    <pattern id="grid6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#1E2A45" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid6)"/>

  <!-- 스쿨존 오버레이 -->
  <rect x="80" y="95" width="440" height="240" rx="8" fill="#A095FF" opacity="0.06"/>

  <!-- 좌상단 배지 -->
  <circle cx="48" cy="48" r="32" fill="#A095FF"/>
  <text x="48" y="44" text-anchor="middle" font-size="11" fill="white" font-weight="700">시나리오</text>
  <text x="48" y="62" text-anchor="middle" font-size="20" fill="white" font-weight="900">06</text>

  <!-- 상단 제목 -->
  <text x="300" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="white">스쿨존 어린이 보호구역</text>
  <text x="300" y="60" text-anchor="middle" font-size="13" fill="#AABBCC">School Zone — 어린이 위험도 ×1.5 상향</text>

  <!-- 우상단 위험도 -->
  <text x="560" y="30" text-anchor="middle" font-size="18" fill="#A095FF">⚠</text>
  <text x="560" y="48" text-anchor="middle" font-size="11" fill="#C8C0FF">위험도</text>
  <text x="560" y="62" text-anchor="middle" font-size="12" fill="#A095FF" font-weight="700">높음</text>

  <!-- 학교 건물 -->
  <rect x="90" y="105" width="140" height="90" rx="4" fill="#1E2A45"/>
  <rect x="90" y="100" width="140" height="18" rx="3" fill="#A095FF" opacity="0.7"/>
  <text x="160" y="114" text-anchor="middle" font-size="10" fill="white" font-weight="700">초등학교</text>
  <rect x="100" y="125" width="28" height="25" rx="2" fill="#0F1A30"/>
  <rect x="138" y="125" width="28" height="25" rx="2" fill="#0F1A30"/>
  <rect x="176" y="125" width="28" height="25" rx="2" fill="#0F1A30"/>
  <rect x="138" y="158" width="28" height="37" rx="2" fill="#0F1A30"/>

  <!-- 도로 (2차로, 우측통행) -->
  <rect x="80" y="210" width="440" height="100" rx="2" fill="#1C2340"/>
  <rect x="80" y="215" width="440" height="43" fill="#162038" opacity="0.45"/>
  <rect x="80" y="262" width="440" height="48" fill="#0F2335" opacity="0.30"/>
  <!-- 중앙선 (노란 dashed) -->
  <rect x="120" y="258" width="32" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="180" y="258" width="32" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="380" y="258" width="32" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <rect x="440" y="258" width="32" height="4" rx="1" fill="#FFD93D" opacity="0.85"/>
  <!-- ★ 진행 방향 -->
  <text x="345" y="234" font-size="11" font-weight="900" fill="#5A6C8C" opacity="0.85">⟵</text>
  <text x="355" y="304" font-size="11" font-weight="900" fill="#7CC8FF" opacity="0.95">내 차 ⟶</text>

  <!-- 횡단보도 보행자 신호등 (위쪽 인도 — 횡단보도 옆 우측) -->
  <rect x="475" y="100" width="6" height="105" fill="#555"/>
  <rect x="458" y="60" width="40" height="50" rx="4" fill="#1A1A1A" stroke="#444" stroke-width="1.2"/>
  <!-- 빨강 (서있는 사람 — 정지) -->
  <rect x="461" y="63" width="34" height="22" rx="2.5" fill="#220A0A"/>
  <g fill="#FF4040">
    <circle cx="478" cy="69" r="2.5"/>
    <rect x="476.5" y="72" width="3" height="7" rx="0.5"/>
    <rect x="474" y="73" width="2.3" height="5"/>
    <rect x="481" y="73" width="2.3" height="5"/>
    <rect x="475.5" y="79" width="2" height="5"/>
    <rect x="479.5" y="79" width="2" height="5"/>
  </g>
  <!-- 녹색 (걷는 사람 — 비활성) -->
  <rect x="461" y="87" width="34" height="22" rx="2.5" fill="#0A1A12"/>
  <g fill="#888" opacity="0.35">
    <circle cx="478" cy="93" r="2.5"/>
    <rect x="476.5" y="96" width="3" height="7" rx="0.5"/>
    <rect x="472.5" y="97" width="2.5" height="5" transform="rotate(-15, 473.7, 99.5)"/>
    <rect x="482" y="98" width="2.3" height="5"/>
    <rect x="473" y="103" width="2.3" height="5" transform="rotate(20, 474, 105.5)"/>
    <rect x="482" y="103" width="2.3" height="5"/>
  </g>
  <text x="478" y="56" text-anchor="middle" font-size="8" fill="#FF6B6B" font-weight="700">보행자 신호</text>

  <!-- 스쿨존 표지 -->
  <rect x="240" y="195" width="120" height="20" rx="4" fill="#A095FF" opacity="0.8"/>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="white" font-weight="700">어린이 보호구역</text>

  <!-- 횡단보도 (한국 표준 + 화면 우측 배치) -->
  <rect x="370" y="214" width="100" height="10" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="229" width="100" height="10" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="244" width="100" height="10" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="259" width="100" height="10" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="274" width="100" height="10" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="289" width="100" height="10" fill="#E8E8E8" opacity="0.92"/>
  <rect x="370" y="299" width="100" height="10" fill="#E8E8E8" opacity="0.92"/>

  <!-- 어린이들 (횡단보도 위 — 우측으로 이동) -->
  <g fill="#FFD5A0">
    <circle cx="400" cy="222" r="7"/>
    <rect x="396" y="229" width="8" height="14" rx="2"/>
    <circle cx="420" cy="225" r="7"/>
    <rect x="416" y="232" width="8" height="14" rx="2"/>
    <circle cx="410" cy="232" r="6" opacity="0.7"/>
    <rect x="407" y="238" width="7" height="12" rx="2" opacity="0.7"/>
  </g>

  <!-- 내 차 (횡단보도 앞 정지 · 화면 우측 절반 + 횡단보도 좌측) -->
  <rect x="265" y="271" width="74" height="38" rx="5" fill="#3A6FD8"/>
  <text x="302" y="294" text-anchor="middle" font-size="10" fill="white" font-weight="800">내 차</text>
  <!-- 진행 방향 화살표 (정지 의도) -->
  <polygon points="345,287 357,287 357,283 365,290 357,297 357,293 345,293" fill="#FF6B6B" opacity="0.7"/>
  <!-- 정지 표시 -->
  <text x="302" y="316" text-anchor="middle" font-size="9" fill="#FF6B6B" font-weight="700">정지 권고</text>

  <!-- vworld GIS 패널 -->
  <rect x="380" y="110" width="155" height="75" rx="8" fill="#150E2A" stroke="#A095FF" stroke-width="1.5"/>
  <text x="458" y="130" text-anchor="middle" font-size="10" fill="#A095FF" font-weight="700">vworld 스쿨존 GIS</text>
  <text x="458" y="146" text-anchor="middle" font-size="9" fill="#AABBCC">위험도 가중치 ×1.5</text>
  <text x="458" y="161" text-anchor="middle" font-size="9" fill="#AABBCC">등교시간대: 07-09시</text>
  <text x="458" y="176" text-anchor="middle" font-size="9" fill="#C8C0FF">현재: 활성 구역</text>

  <!-- 어린이 펄스 애니메이션 -->
  <circle cx="410" cy="230" r="20" fill="none" stroke="#A095FF" stroke-width="2.5" opacity="0">
    <animate attributeName="r" values="20;45;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 속도 제한 표시 -->
  <circle cx="160" cy="215" r="20" fill="#FF3333" stroke="white" stroke-width="2"/>
  <text x="160" y="213" text-anchor="middle" font-size="10" fill="white" font-weight="700">30</text>
  <text x="160" y="225" text-anchor="middle" font-size="7" fill="white">km/h</text>

  <!-- 하단 카피 (좌측) + 데이터 라벨 (우측) -->
  <rect x="0" y="355" width="430" height="45" fill="#0A0F1E" opacity="0.9"/>
  <text x="215" y="383" text-anchor="middle" font-size="13" fill="#00E09A" font-weight="700">vworld 스쿨존 데이터로 위험도 ×1.5 상향</text>

  <rect x="438" y="355" width="162" height="45" fill="#1E2A45" opacity="0.9"/>
  <text x="519" y="370" text-anchor="middle" font-size="9" fill="#7799BB">핵심 데이터</text>
  <text x="519" y="389" text-anchor="middle" font-size="12" fill="#A095FF" font-weight="800">스쿨존 GIS + 시간대</text>
</svg>
